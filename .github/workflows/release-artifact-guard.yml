# SPDX-License-Identifier: GPL-3.0-or-later
name: Release artefact guard

on:
  push:
    branches:
      - "c-first-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-local-installer:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install release-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake dpkg-dev pkg-config zip unzip python3 python3-gi python3-cairo \
            gir1.2-gtk-3.0 libgtk-3-dev policykit-1 udisks2 util-linux makefs \
            libext2fs-dev libsqlite3-dev libssl-dev

      - name: Build, inspect, extract and execute local installer
        shell: bash
        run: |
          set -euo pipefail
          ./tests/test_release_artifacts.sh
