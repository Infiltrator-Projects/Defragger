# SPDX-License-Identifier: GPL-3.0-or-later
name: Build and publish release

on:
  workflow_run:
    workflows: ["Project quality gate"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: publish-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  quarantine-notice:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      startsWith(github.event.workflow_run.head_commit.message, 'Release ')
    runs-on: ubuntu-24.04
    steps:
      - name: Refuse publication while the safety audit is open
        run: |
          echo "Release publication is quarantined pending the independent filesystem-safety audit." >&2
          echo "See defragger/docs/AUDIT_STATUS.md." >&2
          exit 1

  release:
    # Deliberate static freeze. Remove only in a reviewed audit-exit change.
    if: ${{ false }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    defaults:
      run:
        working-directory: defragger
    env:
      EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Check out exact tested main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Verify exact current main release source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags
          head_commit=$(git rev-parse HEAD)
          main_commit=$(git rev-parse origin/main)
          test "$head_commit" = "$EXPECTED_SHA"
          test "$main_commit" = "$EXPECTED_SHA"
          VERSION=$(tr -d '\r\n' < VERSION)
          test -n "$VERSION"
          subject=$(git log -1 --format=%s "$head_commit")
          if [[ "$subject" != "Release ${VERSION}" && "$subject" != "Release ${VERSION}:"* ]]; then
            echo "Release commit subject must begin with Release ${VERSION}." >&2
            exit 1
          fi
          TAG="v${VERSION}"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "Release tag ${TAG} already exists; published releases are immutable." >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; published releases are immutable." >&2
            exit 1
          fi

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake dpkg-dev pkg-config zip unzip python3 python3-gi python3-cairo \
            gir1.2-gtk-3.0 libgtk-3-dev policykit-1 udisks2 util-linux makefs \
            libext2fs-dev libsqlite3-dev libssl-dev

      - name: Validate release packaging and local installer
        shell: bash
        run: |
          set -euo pipefail
          ./tests/test_release_artifacts.sh

      - name: Build release artefacts
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(tr -d '\r\n' < VERSION)
          ./packaging/build-deb.sh
          ./packaging/build-local-run.sh "linux-defragger-${VERSION}-local-folder.run"
          ./packaging/build-source-zip.sh "$PWD/Defragger-${VERSION}.zip"
          test -f "linux-defragger_${VERSION}_amd64.deb"
          test -f "linux-defragger-${VERSION}-local-folder.run"
          test -f "Defragger-${VERSION}.zip"
          ./tests/test_local_installer_end_to_end.sh \
            "./linux-defragger-${VERSION}-local-folder.run"
          sha256sum \
            "linux-defragger_${VERSION}_amd64.deb" \
            "linux-defragger-${VERSION}-local-folder.run" \
            "Defragger-${VERSION}.zip" > RELEASE_SHA256SUMS.txt

      - name: Publish immutable versioned release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main --tags
          head_commit=$(git rev-parse HEAD)
          main_commit=$(git rev-parse origin/main)
          test "$head_commit" = "$EXPECTED_SHA"
          test "$main_commit" = "$EXPECTED_SHA"

          VERSION=$(tr -d '\r\n' < VERSION)
          TAG="v${VERSION}"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "Release tag ${TAG} already exists; published releases are immutable." >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; published releases are immutable." >&2
            exit 1
          fi

          git tag "$TAG" "$EXPECTED_SHA"
          git push origin "$TAG"

          cat > release-body.md <<BODY
          Linux Defragger ${VERSION}.

          Verified release artefacts:
          - Generic AMD64 Debian package
          - Hardware-optimised local compile-and-install program
          - Clean source archive built and tested from this exact commit
          - SHA-256 manifest for all release artefacts

          GitHub also displays its automatic tag source links; the versioned
          Defragger-${VERSION}.zip asset below is the project's tested source deliverable.
          BODY

          gh release create "$TAG" \
            "linux-defragger_${VERSION}_amd64.deb" \
            "linux-defragger-${VERSION}-local-folder.run" \
            "Defragger-${VERSION}.zip" \
            "RELEASE_SHA256SUMS.txt" \
            --verify-tag \
            --target "$EXPECTED_SHA" \
            --title "Linux Defragger ${VERSION}" \
            --notes-file release-body.md

          expected_assets=$(printf '%s\n%s\n%s\n%s\n' \
            "linux-defragger_${VERSION}_amd64.deb" \
            "linux-defragger-${VERSION}-local-folder.run" \
            "Defragger-${VERSION}.zip" \
            "RELEASE_SHA256SUMS.txt" | sort)
          published_assets=$(gh release view "$TAG" --json assets --jq '.assets[].name' | sort)
          if [[ "$published_assets" != "$expected_assets" ]]; then
            echo "Release ${TAG} has an unexpected asset set." >&2
            exit 1
          fi
