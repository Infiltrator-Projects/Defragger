# SPDX-License-Identifier: GPL-3.0-or-later
name: Temporary Test Media 117 worker patch

on:
  push:
    branches:
      - c-first-amiga-raw-ufs-117

permissions:
  contents: write

jobs:
  patch-worker:
    if: contains(github.event.head_commit.message, '[patch117]')
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: c-first-amiga-raw-ufs-117

      - name: Apply exact worker patch
        run: |
          python3 tools/patch-test-media-117.py
          git diff --check
          grep -Fq 'create_amiga_and_populate' test_media/test_media_worker.c
          grep -Fq 'ldtm_verify_amiga_payload' test_media/test_media_worker.c

      - name: Commit only worker integration
        run: |
          git config user.name 'Shannon Smith'
          git config user.email 'infiltratr@yandex.com'
          git add -- test_media/test_media_worker.c
          git diff --cached --check
          git commit -m 'Use raw C Amiga Test Media population'
          git push origin HEAD:c-first-amiga-raw-ufs-117
