# SPDX-License-Identifier: GPL-3.0-or-later
name: Wire media harness CTest

on:
  push:
    branches: [c-first-media-harness-112]
    paths:
      - .github/workflows/media-harness-112-ctest.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c-first-media-harness-112
          submodules: recursive
      - name: Register permanent media harness CTest
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('cmake/project.cmake')
          text = path.read_text()
          needle = '''    add_test(NAME linux-defragger-tests
             COMMAND ${CMAKE_CURRENT_SOURCE_DIR}/tests/run_tests.sh
                     $<TARGET_FILE:linux-defragger-fat-worker>)
'''
          replacement = '''    add_test(NAME linux-defragger-media-harness
             COMMAND python3 ${CMAKE_CURRENT_SOURCE_DIR}/tests/test_media_harness.py)
''' + needle
          if needle not in text:
              raise SystemExit('linux-defragger-tests CTest block not found')
          path.write_text(text.replace(needle, replacement, 1))
          PY
          git diff --check -- cmake/project.cmake
          git config user.name 'Shannon Smith'
          git config user.email 'infiltratr@yandex.com'
          git add cmake/project.cmake
          git diff --cached --check
          git commit -m 'Run media harness safety checks in CTest'
          git push origin HEAD:c-first-media-harness-112
