name: Apply EXT4 fixture type correction

on:
  push:
    branches:
      - fix/ext4-data-only-relayout

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ext4-data-only-relayout
          fetch-depth: 0
      - name: Correct libext2fs extent-info type
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('defragger/tests/make_ext4_image.c')
          text = path.read_text()
          old = '    struct ext2fs_extent_info info;'
          new = '    struct ext2_extent_info info;'
          if text.count(old) != 1:
              raise SystemExit(f'expected one extent-info type match, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/apply-ext4-fixture-type-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add defragger/tests/make_ext4_image.c .github/workflows/apply-ext4-fixture-type-fix.yml
          git diff --cached --check
          git commit -m "Fix EXT4 deep-extent fixture type"
          git push origin HEAD:fix/ext4-data-only-relayout
