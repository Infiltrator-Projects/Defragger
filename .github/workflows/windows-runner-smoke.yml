name: Windows runner smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-runner-smoke:
    name: Windows runner ${{ matrix.slot }}
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        slot: [1, 2, 3, 4, 5]

    runs-on: [self-hosted, Windows, ARM64]
    timeout-minutes: 10

    steps:
      - name: Prove runner identity
        shell: cmd
        run: |
          echo Slot: ${{ matrix.slot }}
          echo Runner name: %RUNNER_NAME%
          echo Runner OS: %RUNNER_OS%
          echo Runner architecture: %RUNNER_ARCH%
          echo Computer name: %COMPUTERNAME%
          echo Processor architecture: %PROCESSOR_ARCHITECTURE%

      - name: Hold all five runners busy together
        shell: cmd
        run: |
          echo Holding %RUNNER_NAME% busy for 120 seconds...
          ping 127.0.0.1 -n 121 >nul
          echo Smoke test complete on %RUNNER_NAME%
