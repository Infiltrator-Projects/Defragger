# SPDX-License-Identifier: GPL-3.0-or-later
name: C-first easy conversions

on:
  push:
    branches: [c-first-easy, c-first-minix]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config python3 python3-gi python3-cairo \
            gir1.2-gtk-3.0 policykit-1 udisks2 util-linux \
            libext2fs-dev libsqlite3-dev libssl-dev

      - name: Build existing project with warnings as errors
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DLD_ENABLE_WERROR=ON \
            -DBUILD_TESTING=ON
          cmake --build build -j2

      - name: Run existing native C tests
        run: ctest --test-dir build --output-on-failure -E '^linux-defragger-tests$'

      - name: Compile and test side-by-side APFS C parser
        run: |
          cc -std=c11 \
            -Wall -Wextra -Wpedantic -Wconversion -Wshadow -Wformat=2 -Werror \
            -D_FILE_OFFSET_BITS=64 -D_GNU_SOURCE \
            -Isrc/core -Igui/filesystems/apfs/native \
            gui/filesystems/apfs/native/apfs_native.c \
            tests/test_apfs_native.c \
            src/core/ld_io.c src/core/ld_runtime.c \
            -o build/linux-defragger-apfs-native-test-direct
          ./build/linux-defragger-apfs-native-test-direct

      - name: Compile and test side-by-side Minix C parser
        run: |
          cc -std=c11 \
            -Wall -Wextra -Wpedantic -Wconversion -Wshadow -Wformat=2 -Werror \
            -D_FILE_OFFSET_BITS=64 -D_GNU_SOURCE \
            -Isrc/core -Igui/filesystems/minix/native \
            gui/filesystems/minix/native/minix_native.c \
            tests/test_minix_native.c \
            src/core/ld_io.c \
            -o build/linux-defragger-minix-native-test-direct
          ./build/linux-defragger-minix-native-test-direct

      - name: Test APFS worker interface
        run: |
          test "$(build/linux-defragger-apfs-worker --version)" = \
            "linux-defragger-apfs-worker $(tr -d '\r\n' < VERSION)"
          python3 - <<'PY'
          import struct
          p = 'build/apfs-worker-test.img'
          b = bytearray(4096)
          b[32:36] = b'NXSB'
          struct.pack_into('<I', b, 36, 4096)
          struct.pack_into('<Q', b, 40, 123456)
          b[72:88] = bytes(range(1, 17))
          open(p, 'wb').write(b)
          PY
          build/linux-defragger-apfs-worker identify build/apfs-worker-test.img \
            | grep -q '^{"filesystem":"apfs","block_size":4096,"block_count":123456}$'
          build/linux-defragger-apfs-worker analyse-json build/apfs-worker-test.img \
            | grep -q '^{"filesystem":"apfs","block_size":4096,"block_count":123456,"container_uuid":"0102030405060708090a0b0c0d0e0f10"}$'
          printf 'NOPE' | dd of=build/apfs-worker-test.img bs=1 seek=32 conv=notrunc status=none
          if build/linux-defragger-apfs-worker identify build/apfs-worker-test.img; then
            echo 'APFS worker accepted invalid magic' >&2
            exit 1
          fi

      - name: Test production APFS Python adapter against native worker
        env:
          PYTHONPATH: ${{ github.workspace }}/gui
          PYTHONDONTWRITEBYTECODE: '1'
          LINUX_DEFRAGGER_APFS_WORKER: ${{ github.workspace }}/build/linux-defragger-apfs-worker
        run: |
          python3 - <<'PY'
          import os
          import struct
          import tempfile
          from filesystems.apfs.plugin import APFSBackend

          fd, path = tempfile.mkstemp(prefix='linux-defragger-apfs-adapter-', suffix='.img')
          os.close(fd)
          try:
              block = bytearray(4096)
              block[32:36] = b'NXSB'
              struct.pack_into('<I', block, 36, 4096)
              struct.pack_into('<Q', block, 40, 64)
              block[72:88] = bytes(range(1, 17))
              with open(path, 'wb') as image:
                  image.write(block)
              backend = APFSBackend()
              assert backend.probe(path)
              result = backend.map(path, 16)
              assert result['filesystem'] == 'apfs'
              assert result['unit_size'] == 4096
              assert result['total_units'] == 64
              assert result['used_bytes'] == 4096
              assert result['unknown_bytes'] == 63 * 4096
              assert result['details']['container_uuid'] == '0102030405060708090a0b0c0d0e0f10'
              with open(path, 'r+b') as image:
                  image.seek(32)
                  image.write(b'NOPE')
              assert not backend.probe(path)
          finally:
              os.unlink(path)
          PY
          python3 tests/test_analysis_plugins.py
