name: One-shot final Defragger branch cleanup

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/final-branch-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    if: github.head_ref == 'maintenance/final-branch-cleanup'
    runs-on: ubuntu-latest
    steps:
      - name: Remove completed temporary branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for branch in fix/pyright-gi-import maintenance/release-dispatch-135; do
            gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
            echo "Deleted completed branch: $branch"
          done
      - name: Remove this temporary maintenance branch
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/git/refs/heads/maintenance/final-branch-cleanup"
