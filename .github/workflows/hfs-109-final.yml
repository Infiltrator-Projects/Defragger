# SPDX-License-Identifier: GPL-3.0-or-later
name: Classic HFS 109 final production gate

on:
  push:
    branches: [c-first-hfs-109]
    paths: [.github/workflows/hfs-109-final.yml]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: c-first-hfs-109
      - name: Add permanent Classic HFS ownership guard
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/test_architecture.py')
          s = p.read_text()

          old = '''        "ufs": {"ufs_native.h", "ufs_native.c", "ufs_worker.c"},
                  "zfs": {"zfs_native.h", "zfs_native.c", "zfs_worker.c"},
              }
          '''
          new = '''        "ufs": {"ufs_native.h", "ufs_native.c", "ufs_worker.c"},
                  "zfs": {"zfs_native.h", "zfs_native.c", "zfs_worker.c"},
                  "hfs": {"analyser.c"},
              }
          '''
          if s.count(old) != 1:
              raise SystemExit(f'HFS required-native anchor count {s.count(old)}')
          s = s.replace(old, new, 1)

          old = '''    zfs_plugin = (GUI / "filesystems" / "zfs" / "plugin.py").read_text()
              for forbidden in ("Reader", "_UBER_MAGIC_LE", "_UBER_MAGIC_BE", "_WINDOW_SIZE", "aggregate_ranges", "data.find"):
                  assert forbidden not in zfs_plugin
              assert 'resolve_program("zfs-native"' in zfs_plugin

              ntfs_plan = (GUI / "filesystems" / "ntfs" / "native" / "ntfs_plan.c").read_text()
          '''
          new = '''    zfs_plugin = (GUI / "filesystems" / "zfs" / "plugin.py").read_text()
              for forbidden in ("Reader", "_UBER_MAGIC_LE", "_UBER_MAGIC_BE", "_WINDOW_SIZE", "aggregate_ranges", "data.find"):
                  assert forbidden not in zfs_plugin
              assert 'resolve_program("zfs-native"' in zfs_plugin

              hfs_plugin = (GUI / "filesystems" / "hfs" / "plugin.py").read_text()
              for forbidden in ("Reader", "aggregate_bitmap", "u16be", "u32be", "bitmap_sector", "candidates ="):
                  assert forbidden not in hfs_plugin
              assert 'resolve_program("hfs-native"' in hfs_plugin

              ntfs_plan = (GUI / "filesystems" / "ntfs" / "native" / "ntfs_plan.c").read_text()
          '''
          if s.count(old) != 1:
              raise SystemExit(f'HFS plugin-guard anchor count {s.count(old)}')
          s = s.replace(old, new, 1)

          old = '''        assert worker in paths
              for obsolete in ("ext-raw", "ntfs-raw", "exfat-raw"):
          '''
          new = '''        assert worker in paths
              assert "linux-defragger-hfs-analyser" in cmake
              assert re.search(
                  r"install\\(TARGETS\\s+linux-defragger-hfs-analyser\\s+"
                  r"RUNTIME DESTINATION lib/linux-defragger/filesystems/hfs\\)",
                  cmake,
              )
              assert "hfs_analyser" in paths
              for obsolete in ("ext-raw", "ntfs-raw", "exfat-raw"):
          '''
          if s.count(old) != 1:
              raise SystemExit(f'HFS install-guard anchor count {s.count(old)}')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          git diff --check -- tests/test_architecture.py
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config python3 libext2fs-dev libsqlite3-dev libssl-dev
      - name: Build exact branch and run permanent native tests
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DLD_ENABLE_WERROR=ON -DBUILD_TESTING=ON
          cmake --build build -j2
          ctest --test-dir build --output-on-failure -R 'linux-defragger-hfs-native|linux-defragger-(ufs|zfs|apfs|minix|swap)-native'
          PYTHONPATH="$PWD/gui" PYTHONDONTWRITEBYTECODE=1 python3 tests/test_architecture.py
          DESTDIR="$PWD/stage" cmake --install build
          test -x stage/usr/local/lib/linux-defragger/filesystems/hfs/hfs_analyser
      - name: Prove real HFS Python bridge delegates to C
        env:
          PYTHONPATH: ${{ github.workspace }}/gui
          PYTHONDONTWRITEBYTECODE: '1'
          LINUX_DEFRAGGER_HFS_ANALYSER: ${{ github.workspace }}/build/hfs_analyser
        run: |
          for forbidden in 'Reader' 'aggregate_bitmap' 'u16be' 'u32be' 'bitmap_sector' 'candidates ='; do
            ! grep -Fq "$forbidden" gui/filesystems/hfs/plugin.py
          done
          img=build/hfs-adapter.img
          truncate -s 16384 "$img"
          printf '\x42\x44' | dd of="$img" bs=1 seek=1024 conv=notrunc status=none
          printf '\x00\x03' | dd of="$img" bs=1 seek=$((1024+14)) conv=notrunc status=none
          printf '\x00\x10' | dd of="$img" bs=1 seek=$((1024+18)) conv=notrunc status=none
          printf '\x00\x00\x02\x00' | dd of="$img" bs=1 seek=$((1024+20)) conv=notrunc status=none
          printf '\x00\x04' | dd of="$img" bs=1 seek=$((1024+28)) conv=notrunc status=none
          printf '\x00\x0b' | dd of="$img" bs=1 seek=$((1024+34)) conv=notrunc status=none
          printf '\x00\x00\x00\x02' | dd of="$img" bs=1 seek=$((1024+84)) conv=notrunc status=none
          printf '\x00\x00\x00\x01' | dd of="$img" bs=1 seek=$((1024+88)) conv=notrunc status=none
          printf '\xb1\x01' | dd of="$img" bs=1 seek=$((3*512)) conv=notrunc status=none
          python3 - <<'PY'
          from filesystems.hfs.plugin import HFSBackend
          p = 'build/hfs-adapter.img'
          backend = HFSBackend()
          assert backend.probe(p)
          result = backend.map(p, 4)
          assert result['schema'] == 1
          assert result['filesystem'] == 'hfs'
          assert result['map_accuracy'] == 'exact'
          assert result['unit_size'] == 512
          assert result['total_units'] == 16
          assert result['cell_count'] == 4
          assert result['free_bytes'] == 11 * 512
          assert result['used_bytes'] == 5 * 512
          assert result['unknown_bytes'] == 0
          assert [(c['free'], c['used']) for c in result['cells']] == [(1, 3), (3, 1), (4, 0), (3, 1)]
          assert result['details']['header_free_blocks'] == 11
          assert result['details']['file_count'] == 2
          assert result['details']['folder_count'] == 1
          with open(p, 'r+b') as image:
              image.seek(1024)
              image.write(b'XX')
          assert not backend.probe(p)
          PY
      - name: Commit only the tested permanent architecture guard
        run: |
          test -z "$(git status --porcelain --untracked-files=no | grep -v '^ M tests/test_architecture.py$' || true)"
          git config user.name 'Shannon Smith'
          git config user.email 'infiltratr@yandex.com'
          git add -- tests/test_architecture.py
          git diff --cached --check
          git commit -m 'Require native Classic HFS ownership'
          git push origin HEAD:c-first-hfs-109
