# SPDX-License-Identifier: GPL-3.0-or-later
name: FAT relayout validation

on:
  push:
    branches:
      - "c-first-fat-unified-relayout"

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config python3 python3-gi python3-cairo \
            gir1.2-gtk-3.0 libgtk-3-dev policykit-1 udisks2 util-linux \
            libext2fs-dev libsqlite3-dev libssl-dev

      - name: Build with warnings as errors
        shell: bash
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DLD_ENABLE_WERROR=ON \
            -DBUILD_TESTING=ON
          cmake --build build -j2
          ctest --test-dir build --output-on-failure -R '^linux-defragger-fat-(volume|directory|journal|growth)$'

      - name: Run isolated FAT relayout integration tests
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee fat-relayout-validation.log) 2>&1
          FAT=build/linux-defragger-fat-worker
          WORK=$(mktemp -d "${TMPDIR:-/tmp}/fat-relayout.XXXXXX")
          trap 'rm -rf "$WORK"' EXIT

          fail() { echo "FAT VALIDATION FAILURE: $*" >&2; exit 1; }

          python3 tests/make_fragmented_image.py "$WORK/fragmented.img" >/dev/null
          "$FAT" defrag "$WORK/fragmented.img" \
            --write --confirm "$WORK/fragmented.img" --journal "$WORK/fragmented.journal" \
            >"$WORK/fragmented.log" 2>&1
          python3 tests/verify_defragged_image.py "$WORK/fragmented.img"

          python3 tests/make_fragmented_directory_image.py "$WORK/directories.img" >/dev/null
          "$FAT" defrag "$WORK/directories.img" \
            --write --confirm "$WORK/directories.img" --journal "$WORK/directories.journal" \
            >"$WORK/directories.log" 2>&1
          python3 tests/verify_directory_defrag.py "$WORK/directories.img"

          python3 tests/make_gapped_contiguous_image.py "$WORK/gapped.img" >/dev/null
          "$FAT" defrag "$WORK/gapped.img" \
            --write --confirm "$WORK/gapped.img" --journal "$WORK/gapped.journal" \
            >"$WORK/gapped.log" 2>&1
          python3 tests/verify_gapped_contiguous.py "$WORK/gapped.img"

          python3 tests/make_growth_defrag_image.py "$WORK/growth.img" >/dev/null
          "$FAT" growth-defrag "$WORK/growth.img" \
            --write --confirm "$WORK/growth.img" --journal "$WORK/growth.journal" \
            --growth-percent 10 >"$WORK/growth.log" 2>&1
          python3 tests/verify_growth_defrag.py "$WORK/growth.img"

          for kind in fat12 fat16; do
            python3 tests/make_fat12_16_image.py "$kind" "$WORK/$kind-defrag.img" fragmented >/dev/null
            "$FAT" defrag "$WORK/$kind-defrag.img" \
              --write --confirm "$WORK/$kind-defrag.img" --journal "$WORK/$kind-defrag.journal" \
              >"$WORK/$kind-defrag.log" 2>&1
            python3 tests/verify_growth_fat12_16.py "$kind" "$WORK/$kind-defrag.img"

            python3 tests/make_fat12_16_image.py "$kind" "$WORK/$kind-growth.img" fragmented >/dev/null
            "$FAT" growth-defrag "$WORK/$kind-growth.img" \
              --write --confirm "$WORK/$kind-growth.img" --journal "$WORK/$kind-growth.journal" \
              --growth-percent 10 >"$WORK/$kind-growth.log" 2>&1
            python3 tests/verify_growth_fat12_16.py "$kind" "$WORK/$kind-growth.img"

            if grep -q 'Growth Defrag layout staged one' "$WORK/$kind-growth.log"; then
              cat "$WORK/$kind-growth.log"
              fail "$kind Growth Defrag fell back to one-object staging"
            fi
            tx=$(sed -n 's/^Growth Defrag layout I\/O:.* in \([0-9][0-9]*\) transaction.*$/\1/p' \
              "$WORK/$kind-growth.log" | tail -n 1)
            [[ -n "$tx" && "$tx" -le 8 ]] || {
              cat "$WORK/$kind-growth.log"
              fail "$kind Growth Defrag used ${tx:-unknown} layout transactions"
            }
            echo "$kind Growth Defrag layout transactions: $tx"
          done

          python3 tests/make_fat16_workspace_image.py "$WORK/fat16-workspace.img" >/dev/null
          "$FAT" defrag "$WORK/fat16-workspace.img" \
            --write --confirm "$WORK/fat16-workspace.img" \
            --journal "$WORK/fat16-workspace.journal" \
            >"$WORK/fat16-workspace.log" 2>&1
          python3 tests/verify_fat16_workspace_image.py "$WORK/fat16-workspace.img"
          if grep -q 'Defragment layout staged one' "$WORK/fat16-workspace.log"; then
            cat "$WORK/fat16-workspace.log"
            fail 'FAT16 Defragment fell back to one-object staging'
          fi

          "$FAT" growth-defrag "$WORK/fat16-workspace.img" \
            --write --confirm "$WORK/fat16-workspace.img" \
            --journal "$WORK/fat16-workspace-growth.journal" --growth-percent 10 \
            >"$WORK/fat16-workspace-growth.log" 2>&1
          grep -q 'canonical 10% growth gaps verified' "$WORK/fat16-workspace-growth.log" || {
            cat "$WORK/fat16-workspace-growth.log"
            fail 'FAT16 Growth layout verification missing'
          }

          "$FAT" defrag "$WORK/fat16-workspace.img" \
            --write --confirm "$WORK/fat16-workspace.img" \
            --journal "$WORK/fat16-growth-to-packed.journal" \
            >"$WORK/fat16-growth-to-packed.log" 2>&1
          python3 tests/verify_fat16_workspace_image.py "$WORK/fat16-workspace.img"
          if grep -q 'Defragment layout staged one' "$WORK/fat16-growth-to-packed.log"; then
            cat "$WORK/fat16-growth-to-packed.log"
            fail 'FAT16 Growth-to-packed Defragment fell back to one-object staging'
          fi

          echo 'Isolated FAT relayout integration tests passed.'

      - name: Report validation result on PR 2
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          printf 'Isolated FAT relayout validation: **%s** for `%s`.\n' "$JOB_STATUS" "$GITHUB_SHA" > /tmp/body.md
          if [[ "$JOB_STATUS" != "success" && -f fat-relayout-validation.log ]]; then
            printf '\nLast validation output:\n```text\n' >> /tmp/body.md
            tail -n 80 fat-relayout-validation.log >> /tmp/body.md
            printf '\n```\n' >> /tmp/body.md
          fi
          gh pr comment 2 --body-file /tmp/body.md
