# SPDX-License-Identifier: GPL-3.0-or-later
name: Validate NTFS terminal workspace relayout

on:
  push:
    branches:
      - c-first-ntfs-workspace-relayout-126-work
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-test-publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out validation branch
        uses: actions/checkout@v4
        with:
          ref: c-first-ntfs-workspace-relayout-126-work
          fetch-depth: 0
          submodules: recursive

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config python3 python3-gi python3-cairo gir1.2-gtk-3.0 libgtk-3-dev policykit-1 udisks2 util-linux libext2fs-dev libsqlite3-dev libssl-dev

      - name: Generate clean candidate from main
        shell: bash
        run: |
          set -euo pipefail
          cp tests/apply_ntfs_workspace_relayout_patch.py /tmp/apply-ntfs-workspace.py
          cp tests/fix_ntfs_workspace_patch_generator.py /tmp/fix-ntfs-generator.py
          sed -i 's|ROOT = Path(__file__).resolve().parents\[1\]|ROOT = Path.cwd()|' /tmp/apply-ntfs-workspace.py
          python3 /tmp/fix-ntfs-generator.py /tmp/apply-ntfs-workspace.py
          git fetch origin main
          git checkout -B generated origin/main
          python3 /tmp/apply-ntfs-workspace.py
          python3 - <<'PY'
          from pathlib import Path

          worker = Path('gui/filesystems/ntfs/native/ntfs_worker.c')
          worker_text = worker.read_text(encoding='utf-8')
          old_direct = '''        printf("NTFS direct metadata layout: %zu supported streams already have their canonical payload placement; no payload relocation is required.\\n",\n               placements.count);\n        fflush(stdout);\n'''
          new_direct = '''        printf("NTFS direct metadata layout: %zu supported streams already have their canonical payload placement; no payload relocation is required.\\n",\n               placements.count);\n        if (placements.fixed_streams != 0)\n            printf("Preserving %llu unsupported-but-safe NTFS user stream%s in place as fixed allocation obstacle%s.\\n",\n                   (unsigned long long)placements.fixed_streams,\n                   placements.fixed_streams == 1U ? "" : "s",\n                   placements.fixed_streams == 1U ? "" : "s");\n        if (placements.fixed_slack_clusters != 0)\n            printf("NTFS fixed allocations leave %llu unavoidable low-address free cluster%s too small to fill with complete movable streams; preserving them.\\n",\n                   (unsigned long long)placements.fixed_slack_clusters,\n                   placements.fixed_slack_clusters == 1U ? "" : "s");\n        fflush(stdout);\n'''
          if worker_text.count(old_direct) != 1:
              raise SystemExit(f'expected one direct metadata logging anchor, found {worker_text.count(old_direct)}')
          worker.write_text(worker_text.replace(old_direct, new_direct, 1), encoding='utf-8')

          path = Path('tests/test_native_top3.py')
          text = path.read_text(encoding='utf-8')
          old = '    assert "@@LIVE_RANGES " in output, output\n    assert "verified allocated/metadata ranges instead of rewriting the full" in output, output\n'
          new = '    assert "exFAT unified workspace layout:" in output, output\n    assert "internally verified native-C exFAT working image" not in output, output\n'
          if text.count(old) != 2:
              raise SystemExit(f'expected two legacy exFAT assertions, found {text.count(old)}')
          text = text.replace(old, new)
          old_run = '''        check=True,\n        text=True,\n        stdout=subprocess.PIPE,\n        stderr=subprocess.STDOUT,\n    )\n    assert f'@@RESULT {{"operation":"{operation}","status":"completed"' in completed.stdout\n'''
          new_run = '''        check=False,\n        text=True,\n        stdout=subprocess.PIPE,\n        stderr=subprocess.STDOUT,\n    )\n    if completed.returncode != 0:\n        raise AssertionError(\n            f"{operation} failed with rc={completed.returncode}\\noutput:\\n{completed.stdout}"\n        )\n    assert f'@@RESULT {{"operation":"{operation}","status":"completed"' in completed.stdout\n'''
          if text.count(old_run) != 1:
              raise SystemExit(f'expected one mutation runner anchor, found {text.count(old_run)}')
          path.write_text(text.replace(old_run, new_run, 1), encoding='utf-8')
          PY
          git diff --check

      - name: Compile native engines with warnings as errors
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DLD_ENABLE_WERROR=ON -DBUILD_TESTING=ON
          cmake --build build -j2 --target \
            linux-defragger-ntfs-worker \
            linux-defragger-exfat-worker \
            linux-defragger-fat-worker \
            linux-defragger-ext-worker \
            linux-defragger-ext-fixture

      - name: Run native FAT exFAT NTFS regression coverage
        shell: bash
        run: |
          set -euo pipefail
          LINUX_DEFRAGGER_BUILD_DIR="$PWD/build" PYTHONPATH="$PWD/gui:$PWD/tests" \
            python3 tests/test_native_top3.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_no_external_fs_tools.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_architecture.py
          bash tests/test_fat_relayout_engine.sh build/linux-defragger-fat-worker
          ctest --test-dir build --output-on-failure -R 'linux-defragger-exfat-relayout'

      - name: Publish validated code-only branch
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            gui/filesystems/ntfs/native/ntfs_native.h \
            gui/filesystems/ntfs/native/ntfs_plan.c \
            gui/filesystems/ntfs/native/ntfs_worker.c \
            tests/test_native_top3.py
          git diff --cached --check
          git commit -m "Add direct NTFS terminal workspace relayout"
          git push --force origin HEAD:c-first-ntfs-workspace-relayout-126-final
