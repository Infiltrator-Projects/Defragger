# SPDX-License-Identifier: GPL-3.0-or-later
name: Refresh Defragger APT publication

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Released Defragger version (for example 1.8.0-141)
        required: true
        type: string
      release_sha:
        description: Exact released Defragger commit SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: apt-refresh-defragger
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    env:
      APP_ID: defragger
      EVENT_VERSION: ${{ github.event.release.tag_name }}
      EVENT_SHA: ${{ github.event.release.target_commitish }}
      MANUAL_VERSION: ${{ inputs.version }}
      MANUAL_SHA: ${{ inputs.release_sha }}
    steps:
      - name: Resolve immutable release identity
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            version="${EVENT_VERSION#v}"
            release_sha="${EVENT_SHA}"
          else
            version="${MANUAL_VERSION#v}"
            release_sha="${MANUAL_SHA}"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$ ]]
          [[ "$release_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "RELEASE_SHA=$release_sha" >> "$GITHUB_ENV"

      - name: Dispatch and verify central APT publication
        env:
          DISPATCH_TOKEN: ${{ secrets.APT_REPOSITORY_DISPATCH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          payload="$(jq -nc --arg repository "$GITHUB_REPOSITORY" --arg sha "$RELEASE_SHA"             '{event_type:"application-release",client_payload:{repository:$repository,sha:$sha}}')"
          if [[ -n "${DISPATCH_TOKEN:-}" ]]; then
            if ! curl --fail-with-body --silent --show-error --request POST               --header "Authorization: Bearer $DISPATCH_TOKEN"               --header "Accept: application/vnd.github+json"               --header "X-GitHub-Api-Version: 2022-11-28"               --data "$payload"               https://api.github.com/repos/Infiltrator-Projects/Infiltrator-Repository/dispatches; then
              echo "::warning::Immediate APT dispatch failed; waiting for the repository safety refresh."
            fi
          else
            echo "::warning::APT dispatch token is unavailable; waiting for the repository safety refresh."
          fi

          catalogue='https://infiltrator-projects.github.io/Infiltrator-Repository/catalogue/apps.json'
          for attempt in $(seq 1 72); do
            if curl -fsS --retry 2 --retry-delay 1 "$catalogue?release=$RELEASE_SHA&attempt=$attempt"               | jq -e --arg id "$APP_ID" --arg version "$VERSION"                 '.[] | select(.id == $id and .version == $version)' >/dev/null; then
              echo "APT repository advertises $APP_ID $VERSION."
              exit 0
            fi
            echo "Waiting for APT publication of $APP_ID $VERSION ($attempt/72)..."
            sleep 10
          done
          echo "::error::Central APT repository did not advertise $APP_ID $VERSION within 12 minutes."
          exit 1
