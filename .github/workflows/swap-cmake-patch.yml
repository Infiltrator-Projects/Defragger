# SPDX-License-Identifier: GPL-3.0-or-later
name: Integrate Swap native CMake targets

on:
  push:
    branches: [c-first-swap]
    paths:
      - .github/workflows/swap-cmake-patch.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config \
            libext2fs-dev libsqlite3-dev libssl-dev

      - name: Insert Swap targets at stable CMake anchors
        shell: bash
        run: |
          set -euo pipefail
          awk '
          /^find_package\(SQLite3 REQUIRED\)/ && !build_added {
              print "# Linux swap identification, metadata and allocation mapping are native C."
              print "# Python remains only as a temporary GUI/backend adapter."
              print "add_library(linux-defragger-swap-native STATIC"
              print "    gui/filesystems/swap/native/swap_native.c)"
              print "target_include_directories(linux-defragger-swap-native PUBLIC"
              print "    \"${CMAKE_CURRENT_SOURCE_DIR}/src/core\""
              print "    \"${CMAKE_CURRENT_SOURCE_DIR}/gui/filesystems/swap/native\""
              print "    \"${LD_GENERATED_DIR}\")"
              print "target_compile_options(linux-defragger-swap-native PRIVATE ${LD_WARNING_FLAGS})"
              print "target_compile_definitions(linux-defragger-swap-native PRIVATE"
              print "    _FILE_OFFSET_BITS=64 _GNU_SOURCE)"
              print "target_link_libraries(linux-defragger-swap-native PUBLIC linux-defragger-core)"
              print ""
              print "add_executable(linux-defragger-swap-worker"
              print "    gui/filesystems/swap/native/swap_worker.c)"
              print "target_include_directories(linux-defragger-swap-worker PRIVATE"
              print "    \"${CMAKE_CURRENT_SOURCE_DIR}/src/core\""
              print "    \"${CMAKE_CURRENT_SOURCE_DIR}/gui/filesystems/swap/native\""
              print "    \"${LD_GENERATED_DIR}\")"
              print "target_compile_options(linux-defragger-swap-worker PRIVATE ${LD_WARNING_FLAGS})"
              print "target_compile_definitions(linux-defragger-swap-worker PRIVATE"
              print "    _FILE_OFFSET_BITS=64 _GNU_SOURCE)"
              print "target_link_libraries(linux-defragger-swap-worker PRIVATE"
              print "    linux-defragger-swap-native linux-defragger-core)"
              print ""
              build_added=1
          }
          /^install\(TARGETS linux-defragger-xfs-worker/ && !install_added {
              print "install(TARGETS linux-defragger-swap-worker"
              print "        RUNTIME DESTINATION lib/linux-defragger/filesystems/swap)"
              install_added=1
          }
          /add_executable\(linux-defragger-xfs-metadata-test/ && !test_added {
              print "    add_executable(linux-defragger-swap-native-test"
              print "        tests/test_swap_native.c)"
              print "    target_include_directories(linux-defragger-swap-native-test PRIVATE"
              print "        \"${CMAKE_CURRENT_SOURCE_DIR}/gui/filesystems/swap/native\""
              print "        \"${CMAKE_CURRENT_SOURCE_DIR}/src/core\" \"${LD_GENERATED_DIR}\")"
              print "    target_compile_options(linux-defragger-swap-native-test PRIVATE ${LD_WARNING_FLAGS})"
              print "    target_compile_definitions(linux-defragger-swap-native-test PRIVATE"
              print "        _FILE_OFFSET_BITS=64 _GNU_SOURCE)"
              print "    target_link_libraries(linux-defragger-swap-native-test PRIVATE"
              print "        linux-defragger-swap-native linux-defragger-core)"
              print "    add_test(NAME linux-defragger-swap-native COMMAND linux-defragger-swap-native-test)"
              print ""
              test_added=1
          }
          { print }
          END {
              if (!build_added || !install_added || !test_added) exit 42
          }
          ' CMakeLists.txt > CMakeLists.txt.new
          mv CMakeLists.txt.new CMakeLists.txt
          test "$(grep -c 'add_library(linux-defragger-swap-native' CMakeLists.txt)" -eq 1
          test "$(grep -c 'install(TARGETS linux-defragger-swap-worker' CMakeLists.txt)" -eq 1
          test "$(grep -c 'add_test(NAME linux-defragger-swap-native' CMakeLists.txt)" -eq 1
          git diff --check -- CMakeLists.txt

      - name: Build test and stage integrated Swap targets
        run: |
          cmake -S . -B build-integrated \
            -DCMAKE_BUILD_TYPE=Release \
            -DLD_ENABLE_WERROR=ON \
            -DBUILD_TESTING=ON
          cmake --build build-integrated -j2
          ctest --test-dir build-integrated --output-on-failure -R '^linux-defragger-swap-native$'
          test "$(build-integrated/linux-defragger-swap-worker --version)" = \
            "linux-defragger-swap-worker $(tr -d '\r\n' < VERSION)"
          rm -rf build-stage
          DESTDIR="$PWD/build-stage" cmake --install build-integrated
          test -x build-stage/usr/local/lib/linux-defragger/filesystems/swap/linux-defragger-swap-worker

      - name: Commit only tested CMake integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Shannon Smith'
          git config user.email 'infiltratr@yandex.com'
          git add -- CMakeLists.txt
          test "$(git diff --cached --name-only)" = "CMakeLists.txt"
          git commit -m 'Integrate native Swap worker into CMake'
          git push origin HEAD:c-first-swap
