# SPDX-License-Identifier: GPL-3.0-or-later
name: Test Media 113 bytecode cleanup

on:
  push:
    branches: [c-first-test-media-gui-113]
    paths:
      - .github/workflows/test-media-113-bytecode-clean.yml

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c-first-test-media-gui-113
          fetch-depth: 0
      - name: Restore tracked Python bytecode to 112
        run: |
          set -euo pipefail
          git checkout 7d3794894989e6494bc679846e1d5b16c243860e -- ':(glob)gui/**/__pycache__/*.pyc'
          if git diff --quiet --cached; then
            echo 'No bytecode changes needed.'
            exit 0
          fi
          git config user.name 'Shannon Smith'
          git config user.email 'infiltratr@yandex.com'
          git diff --cached --name-only | grep -E '^gui/.*/?__pycache__/.*\.pyc$'
          git commit -m 'Restore unrelated tracked Python bytecode'
          git push origin HEAD:c-first-test-media-gui-113
