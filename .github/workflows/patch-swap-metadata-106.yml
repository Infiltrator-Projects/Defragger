# SPDX-License-Identifier: GPL-3.0-or-later
name: Focused Swap metadata map fix

on:
  push:
    branches: [c-first-swap-metadata-106]
    paths: [.github/workflows/patch-swap-metadata-106.yml]

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: c-first-swap-metadata-106
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libext2fs-dev libsqlite3-dev libssl-dev

      - name: Patch Swap metadata classification
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('gui/filesystems/swap/native/swap_worker.c')
          text = path.read_text()

          old = '''    const uint64_t bad_bytes = (uint64_t)summary->bad_page_count * summary->page_size;\n    uint64_t free_bytes = 0U;\n    uint64_t used_bytes = 0U;\n    uint64_t unknown_bytes = summary->filesystem_bytes;\n    if (current && !active) {\n        free_bytes = summary->usable_pages * summary->page_size;\n        unknown_bytes = (uint64_t)summary->page_size + bad_bytes;\n    } else if (active) {\n        free_bytes = runtime->total_bytes - runtime->used_bytes;\n        used_bytes = runtime->used_bytes;\n    }\n'''
          new = '''    const uint64_t bad_bytes = (uint64_t)summary->bad_page_count * summary->page_size;\n    const uint64_t reserved_bytes =\n        current ? (uint64_t)summary->page_size + bad_bytes : 0U;\n    uint64_t free_bytes = 0U;\n    uint64_t used_bytes = 0U;\n    uint64_t unknown_bytes = summary->filesystem_bytes;\n    if (current && !active) {\n        free_bytes = summary->usable_pages * summary->page_size;\n        unknown_bytes = 0U;\n    } else if (active) {\n        free_bytes = runtime->total_bytes - runtime->used_bytes;\n        used_bytes = runtime->used_bytes;\n        unknown_bytes = summary->usable_pages * summary->page_size;\n    }\n'''
          if old not in text:
              raise SystemExit('top-level Swap accounting block not found')
          text = text.replace(old, new, 1)

          old = '''                 \"\\\"total_bytes\\\":%llu,\\\"free_bytes\\\":%llu,\\\"used_bytes\\\":%llu,\"\n                 \"\\\"unknown_bytes\\\":%llu,\\\"filesystem_bytes\\\":%llu,\"\n                 \"\\\"outside_bytes\\\":%llu,\\\"cells\\\":[\",\n'''
          new = '''                 \"\\\"total_bytes\\\":%llu,\\\"free_bytes\\\":%llu,\\\"used_bytes\\\":%llu,\"\n                 \"\\\"unknown_bytes\\\":%llu,\\\"reserved_bytes\\\":%llu,\"\n                 \"\\\"filesystem_bytes\\\":%llu,\\\"outside_bytes\\\":%llu,\\\"cells\\\":[\",\n'''
          if old not in text:
              raise SystemExit('Swap JSON field block not found')
          text = text.replace(old, new, 1)

          old = '''                 (unsigned long long)used_bytes,\n                 (unsigned long long)unknown_bytes,\n                 (unsigned long long)summary->filesystem_bytes,\n'''
          new = '''                 (unsigned long long)used_bytes,\n                 (unsigned long long)unknown_bytes,\n                 (unsigned long long)reserved_bytes,\n                 (unsigned long long)summary->filesystem_bytes,\n'''
          if old not in text:
              raise SystemExit('Swap JSON argument block not found')
          text = text.replace(old, new, 1)

          old = '''            bad = bad_pages_in_cell(summary, start, end);\n            const uint64_t header = start == 0U ? 1U : 0U;\n            const uint64_t inside = length - outside;\n            if (active) {\n                unknown = inside - bad;\n            } else {\n                free = inside - bad - header;\n                unknown = header;\n            }\n'''
          new = '''            bad = bad_pages_in_cell(summary, start, end);\n            const uint64_t header = start == 0U ? 1U : 0U;\n            const uint64_t metadata = bad + header;\n            const uint64_t inside = length - outside;\n            bad = metadata;\n            if (active) {\n                unknown = inside - metadata;\n            } else {\n                free = inside - metadata;\n                unknown = 0U;\n            }\n'''
          if old not in text:
              raise SystemExit('Swap per-cell classification block not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Build with warnings as errors
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DLD_ENABLE_WERROR=ON -DBUILD_TESTING=ON
          cmake --build build -j2
          ctest --test-dir build --output-on-failure -R '^linux-defragger-swap-native-test$'

      - name: Verify inactive and active metadata maps
        env:
          LINUX_DEFRAGGER_PROC_SWAPS: ${{ github.workspace }}/build/swap-proc-swaps
        run: |
          cc -std=c11 -O2 -DNDEBUG -D_FORTIFY_SOURCE=3 \
            -Wall -Wextra -Wpedantic -Wconversion -Wshadow -Wformat=2 -Werror \
            -D_FILE_OFFSET_BITS=64 -D_GNU_SOURCE \
            tests/make_swap_fixture.c -o build/make-swap-fixture
          build/make-swap-fixture build/swap-metadata-test.img
          printf 'Filename Type Size Used Priority\n' > "$LINUX_DEFRAGGER_PROC_SWAPS"
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          image = Path('build/swap-metadata-test.img').resolve()
          worker = Path('build/linux-defragger-swap-worker').resolve()
          proc_swaps = Path(os.environ['LINUX_DEFRAGGER_PROC_SWAPS'])

          def mapping():
              result = subprocess.run(
                  [str(worker), 'map', str(image), '--cells', '4'],
                  check=True, text=True, capture_output=True,
                  env=os.environ,
              )
              return json.loads(result.stdout)

          inactive = mapping()
          assert inactive['map_accuracy'] == 'exact'
          assert inactive['free_bytes'] == 9 * 4096
          assert inactive['used_bytes'] == 0
          assert inactive['unknown_bytes'] == 0
          assert inactive['reserved_bytes'] == 3 * 4096
          assert [cell['bad'] for cell in inactive['cells']] == [2, 1, 0, 0]
          assert [cell['free'] for cell in inactive['cells']] == [2, 3, 4, 0]
          assert [cell['unknown'] for cell in inactive['cells']] == [0, 0, 0, 0]
          assert [cell['outside'] for cell in inactive['cells']] == [0, 0, 0, 4]

          proc_swaps.write_text(
              f'Filename Type Size Used Priority\n{image} file 36 12 -3\n',
              encoding='utf-8',
          )
          active = mapping()
          assert active['map_accuracy'] == 'summary'
          assert active['used_bytes'] == 12 * 1024
          assert active['free_bytes'] == 24 * 1024
          assert active['unknown_bytes'] == 9 * 4096
          assert active['reserved_bytes'] == 3 * 4096
          assert [cell['bad'] for cell in active['cells']] == [2, 1, 0, 0]
          assert [cell['unknown'] for cell in active['cells']] == [2, 3, 4, 0]
          assert all(cell['used'] == 0 for cell in active['cells'])
          assert active['cells'][-1]['outside'] == 4
          PY

      - name: Commit tested C fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Shannon Smith'
          git config user.email 'infiltratr@yandex.com'
          git add -- gui/filesystems/swap/native/swap_worker.c
          git diff --cached --check
          git commit -m 'Classify Swap header as reserved metadata'
          git push origin HEAD:c-first-swap-metadata-106
