# SPDX-License-Identifier: GPL-3.0-or-later
name: Swap native adapter checkpoint

on:
  push:
    branches: [c-first-swap]
    paths:
      - .github/workflows/swap-adapter-test.yml

permissions:
  contents: read

jobs:
  adapter-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config python3 \
            libext2fs-dev libsqlite3-dev libssl-dev

      - name: Build normal native worker and C fixture
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DLD_ENABLE_WERROR=ON \
            -DBUILD_TESTING=ON
          cmake --build build -j2
          ctest --test-dir build --output-on-failure -R '^linux-defragger-swap-native$'
          cc -std=c11 -O2 -DNDEBUG -D_FORTIFY_SOURCE=3 \
            -Wall -Wextra -Wpedantic -Wconversion -Wshadow -Wformat=2 -Werror \
            -D_FILE_OFFSET_BITS=64 -D_GNU_SOURCE \
            tests/make_swap_fixture.c -o build/make-swap-fixture
          build/make-swap-fixture build/swap-adapter-test.img

      - name: Verify Python contains no Swap filesystem parsing
        shell: bash
        run: |
          set -euo pipefail
          plugin=gui/filesystems/swap/plugin.py
          for forbidden in 'Reader' 'u32le' '_PAGE_SIZES' '_SIGS' '_PROC_SWAPS' \
                           '_BADPAGES_OFFSET' 'aggregate_ranges' '_runtime_usage' \
                           '_state_ranges' '_header(' 're.sub'; do
            if grep -Fq "$forbidden" "$plugin"; then
              echo "Swap Python adapter still contains filesystem parser primitive: $forbidden" >&2
              exit 1
            fi
          done
          grep -Fq 'resolve_program("swap-native"' "$plugin"
          ! grep -Fq 'solaris-swap' "$plugin"
          ! grep -Fq 'Linux/Solaris Swap' "$plugin"

      - name: Exercise real Swap Python-to-C adapter
        env:
          PYTHONPATH: ${{ github.workspace }}/gui
          PYTHONDONTWRITEBYTECODE: '1'
          LINUX_DEFRAGGER_SWAP_WORKER: ${{ github.workspace }}/build/linux-defragger-swap-worker
          LINUX_DEFRAGGER_PROC_SWAPS: ${{ github.workspace }}/build/fake-proc-swaps
        run: |
          printf 'Filename Type Size Used Priority\n' > "$LINUX_DEFRAGGER_PROC_SWAPS"
          python3 - <<'PY'
          import os
          from pathlib import Path
          from filesystems.swap.plugin import INFO, SwapBackend

          image = Path('build/swap-adapter-test.img')
          proc_swaps = Path(os.environ['LINUX_DEFRAGGER_PROC_SWAPS'])
          backend = SwapBackend()

          assert INFO.display_name == 'Linux Swap'
          assert INFO.aliases == ('swap', 'swapspace', 'linux-swap')
          assert backend.probe(str(image))

          inactive = backend.map(str(image), 4)
          assert inactive['schema'] == 1
          assert inactive['filesystem'] == 'swap'
          assert inactive['map_accuracy'] == 'exact'
          assert inactive['unit_size'] == 4096
          assert inactive['total_units'] == 16
          assert inactive['filesystem_bytes'] == 12 * 4096
          assert inactive['outside_bytes'] == 4 * 4096
          assert inactive['free_bytes'] == 9 * 4096
          assert inactive['used_bytes'] == 0
          assert inactive['unknown_bytes'] == 3 * 4096
          assert inactive['details']['format'] == 'linux-v1'
          assert inactive['details']['byte_order'] == 'little'
          assert inactive['details']['uuid'] == '01020304-0506-0708-090a-0b0c0d0e0f10'
          assert inactive['details']['label'] == 'Native Swap'
          assert inactive['details']['bad_pages'] == 2
          assert inactive['details']['active'] is False
          assert [cell['outside'] for cell in inactive['cells']] == [0, 0, 0, 4]

          target = image.resolve()
          proc_swaps.write_text(
              f'Filename Type Size Used Priority\n{target} file 36 12 -3\n',
              encoding='utf-8',
          )
          active = backend.map(str(image), 4)
          assert active['map_accuracy'] == 'summary'
          assert active['used_bytes'] == 12 * 1024
          assert active['free_bytes'] == 24 * 1024
          assert active['details']['active'] is True
          assert active['details']['priority'] == -3
          assert active['details']['usage_is_aggregate'] is True
          assert all(cell['used'] == 0 for cell in active['cells'])
          assert active['cells'][-1]['outside'] == 4

          with image.open('r+b') as handle:
              handle.seek(4096 - 10)
              handle.write(b'NOT-SWAP!!')
          assert not backend.probe(str(image))
          PY

      - name: Run standard plugin registry smoke test
        env:
          PYTHONPATH: ${{ github.workspace }}/gui
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 tests/test_analysis_plugins.py
