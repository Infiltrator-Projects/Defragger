# SPDX-License-Identifier: GPL-3.0-or-later
name: Validate EXT direct workspace relayout

on:
  push:
    branches:
      - c-first-ext-workspace-129
  pull_request:
    branches:
      - main
    paths:
      - gui/filesystems/ext4/**
      - tests/test_native_top3.py
      - cmake/project.cmake
      - .github/workflows/ext-workspace-129.yml
      - tests/apply_ext_workspace_129.py

permissions:
  contents: write

jobs:
  patch-build-test-publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out validation branch
        uses: actions/checkout@v4
        with:
          ref: c-first-ext-workspace-129
          fetch-depth: 0
          submodules: recursive

      - name: Apply EXT workspace refactor
        run: |
          set -euo pipefail
          python3 tests/apply_ext_workspace_129.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('gui/filesystems/ext4/native/ext_worker.c')
          s = p.read_text(encoding='utf-8')
          old = '''    bool source_touched = false;\n    int result = -1;\n\n    if (ext_open_plan_db(state->plan, true, &db, error) != 0) goto fail_clean;'''
          new = '''    bool source_touched = false;\n\n    if (ext_open_plan_db(state->plan, true, &db, error) != 0) goto fail_clean;'''
          if s.count(old) != 1:
              raise SystemExit('unused-result validation fix anchor is not unique')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config python3 python3-gi python3-cairo \
            gir1.2-gtk-3.0 libgtk-3-dev policykit-1 udisks2 util-linux \
            libext2fs-dev libsqlite3-dev libssl-dev

      - name: Build native engines with warnings as errors
        run: |
          set -euo pipefail
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DLD_ENABLE_WERROR=ON \
            -DBUILD_TESTING=ON
          cmake --build build -j2 --target \
            linux-defragger-ext-worker \
            linux-defragger-ext-fixture \
            linux-defragger-ntfs-worker \
            linux-defragger-exfat-worker \
            linux-defragger-fat-worker

      - name: Run EXT, NTFS and exFAT native regression suite
        env:
          LINUX_DEFRAGGER_BUILD_DIR: ${{ github.workspace }}/build
          PYTHONPATH: ${{ github.workspace }}/gui:${{ github.workspace }}/tests
        run: python3 tests/test_native_top3.py

      - name: Run classic FAT relayout regression
        run: bash tests/test_fat_relayout_engine.sh

      - name: Run GUI model regressions
        env:
          PYTHONPATH: ${{ github.workspace }}/gui
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 tests/test_gui_models.py
          python3 tests/test_gui_volume_identity.py

      - name: Check C-first architecture guards
        run: |
          set -euo pipefail
          grep -Fq 'gui/filesystems/ext4/native/ext_workspace.c' cmake/project.cmake
          grep -Fq 'EXT unified workspace layout:' gui/filesystems/ext4/native/ext_worker.c
          grep -Fq 'ext_apply_mappings(device, db, false, error)' gui/filesystems/ext4/native/ext_worker.c
          grep -Fq 'ext_apply_mappings(state.stage, db, true, error)' gui/filesystems/ext4/native/ext_worker.c
          grep -Fq 'EXT_WORKSPACE_TRANSACTION_BYTES' gui/filesystems/ext4/native/ext_workspace.c
          grep -Fq 'workspace_sha256' gui/filesystems/ext4/native/ext_workspace.c
          ! grep -Fq 'EXT source commit:' tests/test_native_top3.py

      - name: Publish clean validated product branch
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            cmake/project.cmake \
            gui/filesystems/ext4/native/ext_native.h \
            gui/filesystems/ext4/native/ext_plan.c \
            gui/filesystems/ext4/native/ext_worker.c \
            gui/filesystems/ext4/native/ext_workspace.c \
            gui/filesystems/ext4/native/ext_workspace.h \
            tests/test_native_top3.py
          git diff --cached --check
          git commit -m 'Move EXT relayout to direct durable workspace'
          PRODUCT_COMMIT=$(git rev-parse HEAD)
          git fetch origin main
          git checkout -B c-first-ext-workspace-129-final origin/main
          git cherry-pick "$PRODUCT_COMMIT"
          git push --force origin c-first-ext-workspace-129-final
