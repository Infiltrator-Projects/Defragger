# SPDX-License-Identifier: GPL-3.0-or-later
name: Temporary summary UI patch

on:
  push:
    branches:
      - c-first-summary-unknown-ui

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c-first-summary-unknown-ui
      - name: Patch map presentation and regression
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('gui/ui/map_presenter.py')
          s = path.read_text()

          old = '''    labels = operation_labels(capabilities)\n\n    if outside_bytes:\n'''
          new = '''    labels = operation_labels(capabilities)\n    full_allocation_unknown = (\n        not is_swap\n        and str(data.get("map_accuracy") or "").lower() == "summary"\n        and used_bytes == 0\n        and free_bytes == 0\n        and filesystem_bytes > 0\n        and unknown_bytes >= filesystem_bytes\n    )\n\n    if full_allocation_unknown:\n        free_value = "Unknown"\n    elif outside_bytes:\n'''
          if old not in s:
              raise SystemExit('free-value insertion marker not found')
          s = s.replace(old, new, 1)

          old = '''    else:\n        files_value = f"{human_bytes(used_bytes)} allocated"\n        fragmentation_value = "Not calculated" if labels else "Not available"\n\n    unit_size = _optional_int(data, "unit_size", 512)\n'''
          new = '''    else:\n        if full_allocation_unknown:\n            files_value = "Unknown"\n            fragmentation_value = "Not available"\n        else:\n            files_value = f"{human_bytes(used_bytes)} allocated"\n            fragmentation_value = "Not calculated" if labels else "Not available"\n\n    unit_size = _optional_int(data, "unit_size", 512)\n'''
          if old not in s:
              raise SystemExit('files-value block not found')
          s = s.replace(old, new, 1)

          old = '''    elif outside_bytes:\n        caption = (\n            f"Allocation grid: {cell_count:,} cells · white tail is outside the "\n            "active filesystem boundary"\n        )\n    else:\n'''
          new = '''    elif full_allocation_unknown:\n        caption = (\n            f"Allocation grid: {cell_count:,} cells · exact allocated/free "\n            "locations are not decoded yet"\n        )\n    elif outside_bytes:\n        caption = (\n            f"Allocation grid: {cell_count:,} cells · white tail is outside the "\n            "active filesystem boundary"\n        )\n    else:\n'''
          if old not in s:
              raise SystemExit('caption block not found')
          s = s.replace(old, new, 1)

          old = '''    elif has_fragmentation:\n        status = (\n            f"{filesystem} · {_required_int(data, 'fragmented_files')} fragmented files · "\n            f"{_required_int(data, 'fragmented_directories')} fragmented directories"\n        )\n    elif labels:\n'''
          new = '''    elif has_fragmentation:\n        status = (\n            f"{filesystem} · {_required_int(data, 'fragmented_files')} fragmented files · "\n            f"{_required_int(data, 'fragmented_directories')} fragmented directories"\n        )\n    elif full_allocation_unknown:\n        status = (\n            f"{filesystem} read-only summary · exact allocation totals not decoded"\n        )\n    elif labels:\n'''
          if old not in s:
              raise SystemExit('status block not found')
          s = s.replace(old, new, 1)

          old = '''    elif has_fragmentation:\n        analysis_log = (\n            f"Analysis complete: {_required_int(data, 'fragmented_files')} fragmented files, "\n            f"{_required_int(data, 'fragmented_directories')} fragmented directories."\n        )\n    else:\n'''
          new = '''    elif has_fragmentation:\n        analysis_log = (\n            f"Analysis complete: {_required_int(data, 'fragmented_files')} fragmented files, "\n            f"{_required_int(data, 'fragmented_directories')} fragmented directories."\n        )\n    elif full_allocation_unknown:\n        analysis_log = (\n            f"Analysis complete: {filesystem} detected; exact allocated/free totals "\n            "are not decoded by this read-only backend."\n        )\n    else:\n'''
          if old not in s:
              raise SystemExit('analysis-log block not found')
          s = s.replace(old, new, 1)
          path.write_text(s)

          test = Path('tests/test_gui_models.py')
          t = test.read_text()
          marker = '''    read_only = present_allocation_map(domain, 0)\n    assert read_only.fragmentation_value == "Not available"\n    assert "read-only allocation map" in read_only.status\n\n    swap = dict(domain)\n'''
          replacement = '''    read_only = present_allocation_map(domain, 0)\n    assert read_only.fragmentation_value == "Not available"\n    assert "read-only allocation map" in read_only.status\n\n    unknown_cells = [\n        {"start": 0, "end": 3, "free": 0, "used": 0, "unknown": 4},\n        {"start": 4, "end": 7, "free": 0, "used": 0, "unknown": 4},\n    ]\n    for filesystem in ("ufs", "zfs"):\n        unknown_summary = {\n            "backend": "read-only-domain",\n            "filesystem": filesystem,\n            "map_accuracy": "summary",\n            "unit_size": 512,\n            "total_units": 8,\n            "cell_count": 2,\n            "total_bytes": 4096,\n            "free_bytes": 0,\n            "used_bytes": 0,\n            "unknown_bytes": 4096,\n            "cells": unknown_cells,\n        }\n        unknown_view = present_allocation_map(unknown_summary, 0)\n        assert unknown_view.free_value == "Unknown"\n        assert unknown_view.files_value == "Unknown"\n        assert unknown_view.fragmentation_value == "Not available"\n        assert "exact allocation totals not decoded" in unknown_view.status\n        assert "exact allocated/free totals" in unknown_view.analysis_log\n        assert "0 B allocated" not in unknown_view.analysis_log\n        assert "0 B free" not in unknown_view.analysis_log\n\n    swap = dict(domain)\n'''
          if marker not in t:
              raise SystemExit('GUI model test marker not found')
          t = t.replace(marker, replacement, 1)
          test.write_text(t)
          PY

          rm -f .github/workflows/_temporary-summary-ui-patch.yml
          git config user.name "The-First-Infiltrator"
          git config user.email "infiltratr@yandex.com"
          git add gui/ui/map_presenter.py tests/test_gui_models.py .github/workflows/_temporary-summary-ui-patch.yml
          git commit -m "Present fully unknown allocation summaries truthfully"
          git push origin HEAD:c-first-summary-unknown-ui
