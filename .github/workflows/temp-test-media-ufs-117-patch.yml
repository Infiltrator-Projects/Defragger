# SPDX-License-Identifier: GPL-3.0-or-later
name: Temporary Test Media 117 UFS patch

on:
  push:
    branches:
      - c-first-amiga-raw-ufs-117

permissions:
  contents: write

jobs:
  patch-ufs:
    if: contains(github.event.head_commit.message, '[patch117ufs]')
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: c-first-amiga-raw-ufs-117

      - name: Apply exact UFS integration patch
        run: |
          python3 tools/patch-test-media-ufs-117.py
          git diff --check
          grep -Fq 'case LDTM_CREATOR_UFS: return "makefs";' test_media/test_media_core.c
          grep -Fq 'create_ufs_and_populate' test_media/test_media_worker.c
          grep -Fq 'const uint8_t dostype = strcmp(spec->key, "ofs") == 0 ? (uint8_t)0 : (uint8_t)1;' test_media/test_media_worker.c

      - name: Commit only UFS integration
        run: |
          git config user.name 'Shannon Smith'
          git config user.email 'infiltratr@yandex.com'
          git add -- test_media/test_media_core.c test_media/test_media_worker.c
          git diff --cached --check
          git commit -m 'Use makefs for genuine UFS2 test media'
          git push origin HEAD:c-first-amiga-raw-ufs-117
