# SPDX-License-Identifier: GPL-3.0-or-later
name: FAT16 adaptive PR validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          submodules: recursive

      - name: Apply scheduler patch embedded in push workflow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/fat16-adaptive-patch.yml').read_text(encoding='utf-8')
          marker = "          python3 - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          lines = workflow[start:end].splitlines()
          if not lines:
              raise SystemExit('embedded patch script is empty')
          indent = len(lines[0]) - len(lines[0].lstrip(' '))
          prefix = ' ' * indent
          code = '\n'.join(
              line[indent:] if prefix and line.startswith(prefix) else line
              for line in lines
          )
          exec(compile(code, 'fat16-adaptive-patch', 'exec'))
          PY

      - name: Compile focused FAT worker with warnings as errors
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/generated
          VERSION=$(tr -d '\r\n' < VERSION)
          printf '%s\n' \
            '// SPDX-License-Identifier: GPL-3.0-or-later' \
            '#ifndef LD_VERSION_H' \
            '#define LD_VERSION_H' \
            "#define LD_VERSION \"${VERSION}\"" \
            '#endif' > build/generated/version.h
          cc -std=c11 -O2 \
            -Wall -Wextra -Wpedantic -Wconversion -Wshadow -Wformat=2 -Werror \
            -D_FILE_OFFSET_BITS=64 -D_GNU_SOURCE \
            -Isrc/core -Igui/filesystems/fat/native -Ibuild/generated \
            -Ishared/infiltratr-common/include \
            gui/filesystems/fat/native/writer.c \
            gui/filesystems/fat/native/fat_analysis.c \
            gui/filesystems/fat/native/fat_directory.c \
            gui/filesystems/fat/native/fat_growth.c \
            gui/filesystems/fat/native/fat_io.c \
            gui/filesystems/fat/native/fat_journal.c \
            gui/filesystems/fat/native/fat_relocation.c \
            gui/filesystems/fat/native/fat_volume.c \
            src/core/ld_runtime.c src/core/ld_io.c src/core/ld_device.c \
            src/core/ld_stop.c src/core/ld_path.c \
            shared/infiltratr-common/src/core.c \
            shared/infiltratr-common/src/posix.c \
            -pthread -lm -o build/linux-defragger-fat-worker

      - name: Run FAT relayout regressions
        run: bash ./tests/test_fat_relayout_engine.sh build/linux-defragger-fat-worker

      - name: Commit validated scheduler
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- gui/filesystems/fat/native/writer.c; then
            echo 'writer.c already contains the adaptive scheduler'
            exit 0
          fi
          git add gui/filesystems/fat/native/writer.c
          git commit -m "Batch mixed FAT dependency blockers [adaptive-patched]"
          git push origin HEAD:${{ github.head_ref }}
