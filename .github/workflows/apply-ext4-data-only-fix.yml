name: Apply EXT4 data-only relayout fix

on:
  push:
    branches:
      - fix/ext4-data-only-relayout

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ext4-data-only-relayout
          fetch-depth: 0

      - name: Apply exact EXT4 fix and regression fixture
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old!r}")
              path.write_text(text.replace(old, new, 1))

          catalog = Path("defragger/gui/filesystems/ext4/native/ext_catalog.c")
          replace_once(
              catalog,
              "        if (collect_inode_blocks(fs, ino, false, &blocks, &local_error) != 0) {",
              "        /* Fragmentation policy is about file/directory payload placement.\n"
              "           Extent-tree and indirect blocks are filesystem metadata and stay fixed. */\n"
              "        if (collect_inode_blocks(fs, ino, true, &blocks, &local_error) != 0) {",
          )
          replace_once(
              catalog,
              "        if (ino < EXT2_GOOD_OLD_FIRST_INO && ino != EXT2_ROOT_INO && ino != EXT2_JOURNAL_INO)\n"
              "            continue;",
              "        /* Reserved inodes, including the journal inode, are fixed filesystem\n"
              "           metadata. Only the root directory is a movable low-numbered object. */\n"
              "        if (ino < EXT2_GOOD_OLD_FIRST_INO && ino != EXT2_ROOT_INO)\n"
              "            continue;",
          )
          replace_once(
              catalog,
              "        if (collect_inode_blocks(fs, ino, false, &blocks, error) != 0) {",
              "        /* Plan only payload blocks. libext2fs owns the extent/indirect\n"
              "           metadata that describes those mappings and updates it in place. */\n"
              "        if (collect_inode_blocks(fs, ino, true, &blocks, error) != 0) {",
          )

          plan = Path("defragger/gui/filesystems/ext4/native/ext_plan.c")
          replace_once(
              plan,
              "        code = ext2fs_block_iterate3(fs, ino, 0, NULL, replace_mapping, &context);",
              "        code = ext2fs_block_iterate3(fs, ino, BLOCK_FLAG_DATA_ONLY, NULL,\n"
              "                                      replace_mapping, &context);",
          )
          replace_once(
              plan,
              "        code = ext2fs_block_iterate3(fs, ino, BLOCK_FLAG_READ_ONLY, NULL, verify_mapping, &context);",
              "        code = ext2fs_block_iterate3(fs, ino,\n"
              "                                      BLOCK_FLAG_READ_ONLY | BLOCK_FLAG_DATA_ONLY,\n"
              "                                      NULL, verify_mapping, &context);",
          )

          fixture = Path("defragger/tests/make_ext4_image.c")
          high_allocator = '''static errcode_t high_alloc_block(ext2_filsys fs, blk64_t goal, blk64_t *ret) {
              (void)goal;
              HighAllocContext *ctx = fs->priv_data;
              while (ctx->cursor < ctx->limit &&
                     ext2fs_test_block_bitmap2(fs->block_map, ctx->cursor))
                  ctx->cursor++;
              if (ctx->cursor >= ctx->limit) return EXT2_ET_BLOCK_ALLOC_FAIL;
              *ret = ctx->cursor++;
              return 0;
          }
          '''
          fragmented_allocator = high_allocator + '''
          typedef struct {
              blk64_t cursor;
              blk64_t limit;
              blk64_t stride;
          } FragmentAllocContext;

          static errcode_t fragmented_alloc_block(ext2_filsys fs, blk64_t goal, blk64_t *ret) {
              (void)goal;
              FragmentAllocContext *ctx = fs->priv_data;
              while (ctx->cursor < ctx->limit) {
                  blk64_t candidate = ctx->cursor;
                  ctx->cursor += ctx->stride;
                  if (!ext2fs_test_block_bitmap2(fs->block_map, candidate)) {
                      *ret = candidate;
                      return 0;
                  }
              }
              return EXT2_ET_BLOCK_ALLOC_FAIL;
          }
          '''
          replace_once(fixture, high_allocator, fragmented_allocator)

          marker = '''static ext2_ino_t create_directory(ext2_filsys fs, ext2_ino_t parent,
                                             const char *name) {
              ext2_ino_t ino = 0;
              errcode_t err = ext2fs_new_inode(
                  fs, parent, LINUX_S_IFDIR | 0755, fs->inode_map, &ino);
              if (err) fail_ext("allocating test directory inode", err);
              err = ext2fs_mkdir(fs, parent, ino, name);
              if (err) fail_ext("creating test directory", err);
              return ino;
          }
          '''
          helper = marker + '''
          static void require_deep_extent_tree(ext2_filsys fs, ext2_ino_t ino) {
              ext2_extent_handle_t handle = NULL;
              struct ext2fs_extent extent;
              struct ext2fs_extent_info info;
              errcode_t err = ext2fs_extent_open(fs, ino, &handle);
              if (err) fail_ext("opening fragmented test extent tree", err);
              err = ext2fs_extent_get(handle, EXT2_EXTENT_ROOT, &extent);
              if (err) {
                  ext2fs_extent_free(handle);
                  fail_ext("reading fragmented test extent root", err);
              }
              err = ext2fs_extent_get_info(handle, &info);
              if (err) {
                  ext2fs_extent_free(handle);
                  fail_ext("reading fragmented test extent depth", err);
              }
              if (info.max_depth <= 0) {
                  ext2fs_extent_free(handle);
                  fputs("fragmented EXT4 fixture did not create an external extent tree\\n", stderr);
                  exit(1);
              }
              ext2fs_extent_free(handle);
          }
          '''
          replace_once(fixture, marker, helper)

          insertion_point = '''    for (unsigned index = 0; index < 400; ++index) {
                  char name[64];
                  snprintf(name, sizeof(name), "small-%03u.bin", index);
                  create_file(fs, music, name, 1000U + index, (unsigned char)(index & 0xffU));
              }

              /* Keep one referenced file allocation close to the filesystem end.  The
          '''
          replacement = '''    for (unsigned index = 0; index < 400; ++index) {
                  char name[64];
                  snprintf(name, sizeof(name), "small-%03u.bin", index);
                  create_file(fs, music, name, 1000U + index, (unsigned char)(index & 0xffU));
              }

              /* Force a genuinely deep EXT4 extent tree. The previous fixture used
                 extents but was too contiguous to exercise the metadata-vs-payload
                 distinction seen on the 2 GiB Test Media profile. */
              FragmentAllocContext fragmented = {
                  .cursor = 32768,
                  .limit = FILESYSTEM_BLOCKS - 4096,
                  .stride = 2,
              };
              fs->priv_data = &fragmented;
              ext2fs_set_alloc_block_callback(fs, fragmented_alloc_block, NULL);
              ext2_ino_t deep_extents = create_file(
                  fs, music, "deep-extents.bin", 8U * 1024U * 1024U, 'F');
              ext2fs_set_alloc_block_callback(fs, NULL, NULL);
              fs->priv_data = NULL;
              require_deep_extent_tree(fs, deep_extents);

              /* Keep one referenced file allocation close to the filesystem end.  The
          '''
          replace_once(fixture, insertion_point, replacement)
          PY

          rm .github/workflows/apply-ext4-data-only-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add defragger/gui/filesystems/ext4/native/ext_catalog.c \
                  defragger/gui/filesystems/ext4/native/ext_plan.c \
                  defragger/tests/make_ext4_image.c \
                  .github/workflows/apply-ext4-data-only-fix.yml
          git diff --cached --check
          git commit -m "Fix EXT4 data-only relayout"
          git push origin HEAD:fix/ext4-data-only-relayout
