# SPDX-License-Identifier: GPL-3.0-or-later
name: Test Media 113 cleanup

on:
  push:
    branches: [c-first-test-media-gui-113]
    paths:
      - .github/workflows/test-media-113-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c-first-test-media-gui-113
          submodules: recursive

      - name: Remove prototype and lock all-C companion architecture
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          project = Path('cmake/project.cmake')
          text = project.read_text()
          for block in (
              'install(PROGRAMS tools/linux-defragger-testdata.py\n        DESTINATION bin RENAME linux-defragger-testdata)\n',
              'install(PROGRAMS tools/linux-defragger-media-harness.py\n        DESTINATION bin RENAME linux-defragger-media-harness)\n',
          ):
              if block not in text:
                  raise SystemExit(f'missing expected legacy install block: {block!r}')
              text = text.replace(block, '', 1)
          project.write_text(text)

          runner = Path('tests/run_tests.sh')
          text = runner.read_text()
          legacy_test = 'python3 "$ROOT/tests/test_media_harness.py"\n'
          if legacy_test not in text:
              raise SystemExit('legacy media harness test line missing')
          runner.write_text(text.replace(legacy_test, '', 1))

          readme = Path('README.md')
          text = readme.read_text()
          start = text.find('## Physical-media field-test harness\n')
          end = text.find('## Build\n', start)
          if start < 0 or end < 0:
              raise SystemExit('README legacy harness section markers missing')
          section = (
              '## Linux Defragger Test Media\n\n'
              'The package includes **Linux Defragger Test Media**, a separate all-C GTK application for building and verifying sacrificial filesystem test disks. It is not a window inside Linux Defragger and it does not use the Python GUI or the former Python field-test harness. Launch **Linux Defragger Test Media** from the desktop application menu; the executable is `linux-defragger-test-media`.\n\n'
              'The GUI lists physical disks with model, serial, size and transport, marks the system/boot disk as protected, and only enables destructive preparation for a sufficiently large removable, USB or MMC field-media target. Before changing a disk it shows the exact selected device in a destructive confirmation dialog, and the privileged C worker repeats the whole-disk, system-disk, read-only, size and transport checks after privilege elevation.\n\n'
              'The test layout contains dedicated FAT12, FAT16, FAT32, exFAT, NTFS, ext2, ext3, ext4, XFS, Btrfs, AFFS, classic HFS, HFS+, Minix, UFS, ZFS, APFS and Swap slots. Filesystems with a genuine local creator are formatted and populated; missing creators are shown as unavailable, and APFS remains a real reserved partition rather than receiving a fake signature. Normal populated filesystems receive about 200 MiB of deterministic fragmented target data. FAT12 deliberately uses a smaller 4 MiB target and a scaled directory-fragmentation profile so the 64 MiB FAT12 test volume remains valid.\n\n'
              'Fragmentation generation, SHA-256 manifest creation, state recording and post-defrag verification are implemented in C. The GUI shows live per-filesystem status and process output while the worker operates. **Verify After Defrag** mounts/imports only previously populated test filesystems read-only where the host supports doing so and verifies retained file sizes, SHA-256 hashes and directory-entry counts. Host-side state is stored under `/var/tmp/linux-defragger-test-media/`.\n\n'
              'Formatting and mounting utilities such as `mkfs.fat`, `mkfs.xfs`, `hformat` and `zpool` are allowed here because this companion exists solely to manufacture hostile test media. Linux Defragger\'s production analyser and writer engines remain subject to the no-mount/no-external-filesystem-mutation architecture rule.\n\n'
          )
          readme.write_text(text[:start] + section + text[end:])

          architecture = Path('tests/test_architecture.py')
          text = architecture.read_text()
          marker = '\ndef main() -> None:\n'
          if marker not in text:
              raise SystemExit('architecture main marker missing')
          test = '''\ndef test_test_media_companion_is_all_c() -> None:\n    source_dir = ROOT / "test_media"\n    assert source_dir.is_dir()\n    required = {\n        "test_media.h",\n        "test_media_core.c",\n        "test_media_worker.c",\n        "test_media_main.c",\n        "test_media_gui.c",\n    }\n    assert required.issubset({path.name for path in source_dir.iterdir() if path.is_file()})\n    assert not list(source_dir.glob("*.py"))\n    assert not (ROOT / "tools" / "linux-defragger-media-harness.py").exists()\n    assert not (ROOT / "tools" / "linux-defragger-testdata.py").exists()\n    assert not (ROOT / "tests" / "test_media_harness.py").exists()\n\n    cmake = _cmake_source()\n    assert "add_executable(linux-defragger-test-media" in cmake\n    assert "install(TARGETS linux-defragger-test-media RUNTIME DESTINATION bin)" in cmake\n    assert "linux-defragger-media-harness" not in cmake\n    assert "linux-defragger-testdata" not in cmake\n\n    desktop = (ROOT / "packaging" / "io.github.linuxdefragger.TestMedia.desktop").read_text()\n    assert "Exec=linux-defragger-test-media" in desktop\n\n'''
          text = text.replace(marker, test + marker, 1)
          call = '    test_core_remains_filesystem_neutral()\n'
          if call not in text:
              raise SystemExit('architecture call insertion point missing')
          text = text.replace(call, call + '    test_test_media_companion_is_all_c()\n', 1)
          architecture.write_text(text)
          PY

          rm -f tools/linux-defragger-media-harness.py \
                tools/linux-defragger-testdata.py \
                tests/test_media_harness.py

          python3 tests/test_architecture.py
          git diff --check
          git config user.name 'Shannon Smith'
          git config user.email 'infiltratr@yandex.com'
          git add -A
          git diff --cached --check
          git commit -m 'Replace Python test-media prototype with all-C GUI'
          git push origin HEAD:c-first-test-media-gui-113
