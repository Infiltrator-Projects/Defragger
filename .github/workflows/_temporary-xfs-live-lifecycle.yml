name: Temporary XFS live-map lifecycle patch

on:
  push:
    branches:
      - c-first-xfs-live-lifecycle

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c-first-xfs-live-lifecycle
      - name: Patch XFS live-map lifecycle and regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          plan = Path('gui/filesystems/xfs/native/xfs_plan.c')
          s = plan.read_text()
          old = '''    printf("],\\\"moved_total_bytes\\\":%" PRIu64
                     ",\\\"pass\\\":1,\\\"objects_done\\\":0,\\\"objects_total\\\":0,\\\"sequence\\\":%" PRIu64 "}\\n",
                     placed * (uint64_t)block_size, ++(*sequence));
          '''
          new = '''    printf("],\\\"moved_total_bytes\\\":%" PRIu64
                     ",\\\"pass\\\":1,\\\"objects_done\\\":0,\\\"objects_total\\\":0,"
                     "\\\"scope\\\":\\\"stage-preview\\\",\\\"sequence\\\":%" PRIu64 "}\\n",
                     placed * (uint64_t)block_size, ++(*sequence));
          '''
          if old not in s:
              raise SystemExit('XFS live-ranges format block not found')
          plan.write_text(s.replace(old, new, 1))

          worker = Path('gui/filesystems/xfs/native/xfs_worker.c')
          s = worker.read_text()
          old = '''static void emit_live_reset(const XfsCatalogue *catalogue) {
              printf("@@LIVE_RESET {\\\"unit_size\\\":%u,\\\"filesystem_units\\\":%" PRIu64 ",\\\"used_ranges\\\":[",
                     catalogue->geometry.block_size, catalogue->geometry.dblocks);
          '''
          new = '''static void emit_live_reset(const XfsCatalogue *catalogue, const char *scope) {
              printf("@@LIVE_RESET {\\\"scope\\\":\\\"%s\\\",\\\"unit_size\\\":%u,\\\"filesystem_units\\\":%" PRIu64 ",\\\"used_ranges\\\":[",
                     scope, catalogue->geometry.block_size, catalogue->geometry.dblocks);
          '''
          if old not in s:
              raise SystemExit('XFS live-reset producer block not found')
          s = s.replace(old, new, 1)

          old = '''    state.commit_offset = 0;
              if (journal_phase(journal_path, &state, "commit", error) != 0) goto precommit_fail;
              puts("The internally verified raw XFS working image is complete. Starting the persistent source commit."); fflush(stdout);
              if (commit_stage(device, journal_path, &state, &verified, 0, error) != 0) goto commit_fail;
          '''
          new = '''    state.commit_offset = 0;
              if (journal_phase(journal_path, &state, "commit", error) != 0) goto precommit_fail;
              /* Stage relocation strokes are a preview only.  Before any persistent
               * write begins, restore the map to the source filesystem that is
               * actually on disk.  Partial source commits are intentionally not
               * presented as authoritative because XFS is not guaranteed to be
               * self-consistent until the verified commit finishes. */
              if (live_updates) emit_live_reset(&source, "source-authoritative");
              puts("The internally verified raw XFS working image is complete. Starting the persistent source commit."); fflush(stdout);
              if (commit_stage(device, journal_path, &state, &verified, 0, error) != 0) goto commit_fail;
          '''
          if old not in s:
              raise SystemExit('XFS source-commit transition block not found')
          s = s.replace(old, new, 1)

          old = '''    xfs_catalogue_free(&committed);
              if (live_updates) emit_live_reset(&verified);
              transaction_cleanup(journal_path, &state);
          '''
          new = '''    if (live_updates) emit_live_reset(&committed, "verified-authoritative");
              xfs_catalogue_free(&committed);
              transaction_cleanup(journal_path, &state);
          '''
          if old not in s:
              raise SystemExit('XFS final live-reset block not found')
          s = s.replace(old, new, 1)
          worker.write_text(s)

          controller = Path('gui/ui/live_controller.py')
          s = controller.read_text()
          old = '''            if event.kind == "live-reset":
                          updater.reset(event.payload)
                          return LiveEventOutcome(
                              consumed=True,
                              status=(
                                  "Canonical filesystem layout initialised · live allocation "
                                  "writes are now visible"
                              ),
                              map_changed=True,
                              draw_immediately=True,
                          )
          '''
          new = '''            if event.kind == "live-reset":
                          updater.reset(event.payload)
                          scope = str(event.payload.get("scope", "")).lower()
                          if scope == "source-authoritative":
                              status = (
                                  "Authoritative source allocation restored · persistent "
                                  "XFS commit is now in progress"
                              )
                          elif scope == "verified-authoritative":
                              status = (
                                  "Authoritative allocation map refreshed from the verified "
                                  "source filesystem"
                              )
                          else:
                              status = (
                                  "Canonical filesystem layout initialised · live allocation "
                                  "writes are now visible"
                              )
                          return LiveEventOutcome(
                              consumed=True,
                              status=status,
                              map_changed=True,
                              draw_immediately=True,
                          )
          '''
          if old not in s:
              raise SystemExit('GUI live-reset controller block not found')
          s = s.replace(old, new, 1)

          old = '''                display_name = operation_display_name(purpose or "defrag")
                          object_text = (
                              f" · {summary.objects_done:,}/{summary.objects_total:,} objects"
                              if summary.objects_done and summary.objects_total
                              else ""
                          )
                          return LiveEventOutcome(
                              consumed=True,
                              status=(
                                  f"Live allocation update · {display_name} pass "
                                  f"{summary.pass_number}{object_text} · "
                                  f"{human_bytes(summary.moved_total_bytes)} relocated · "
                                  "fragmentation recalculated at completion"
                              ),
                              map_changed=True,
                              draw_immediately=summary.sequence <= 1,
                          )
          '''
          new = '''                display_name = operation_display_name(purpose or "defrag")
                          object_text = (
                              f" · {summary.objects_done:,}/{summary.objects_total:,} objects"
                              if summary.objects_done and summary.objects_total
                              else ""
                          )
                          scope = str(event.payload.get("scope", "")).lower()
                          if scope == "stage-preview":
                              status = (
                                  f"Staging preview · {display_name} pass "
                                  f"{summary.pass_number}{object_text} · "
                                  f"{human_bytes(summary.moved_total_bytes)} arranged · "
                                  "source filesystem unchanged"
                              )
                          else:
                              status = (
                                  f"Live allocation update · {display_name} pass "
                                  f"{summary.pass_number}{object_text} · "
                                  f"{human_bytes(summary.moved_total_bytes)} relocated · "
                                  "fragmentation recalculated at completion"
                              )
                          return LiveEventOutcome(
                              consumed=True,
                              status=status,
                              map_changed=True,
                              draw_immediately=summary.sequence <= 1,
                          )
          '''
          if old not in s:
              raise SystemExit('GUI live-range controller block not found')
          controller.write_text(s.replace(old, new, 1))

          tests = Path('tests/test_gui_models.py')
          t = tests.read_text()
          old_import = 'from ui.map_presenter import AllocationMapError, present_allocation_map\n'
          new_import = old_import + 'from ui.live_controller import LiveEventController\n'
          if 'from ui.live_controller import LiveEventController' not in t:
              if old_import not in t:
                  raise SystemExit('GUI model import marker not found')
              t = t.replace(old_import, new_import, 1)

          marker = '\n\ndef test_invalid_map_is_rejected_before_widget_state_changes() -> None:\n'
          regression = r'''

          def test_xfs_live_strokes_are_preview_then_authoritative() -> None:
              data = {
                  "backend": "read-only-domain",
                  "filesystem": "xfs",
                  "unit_size": 4096,
                  "total_units": 8,
                  "filesystem_bytes": 8 * 4096,
                  "cells": _cells(),
              }
              controller = LiveEventController()

              preview = controller.consume(
                  '@@LIVE_RANGES {"ranges":[[0,16384,4096]],'
                  '"moved_total_bytes":4096,"pass":1,"objects_done":0,'
                  '"objects_total":0,"scope":"stage-preview","sequence":1}',
                  data,
                  purpose="defrag",
              )
              assert preview.map_changed
              assert preview.draw_immediately
              assert preview.status is not None
              assert "Staging preview" in preview.status
              assert "source filesystem unchanged" in preview.status

              source_reset = controller.consume(
                  '@@LIVE_RESET {"scope":"source-authoritative","unit_size":4096,'
                  '"filesystem_units":8,"used_ranges":[[0,8192]]}',
                  data,
                  purpose="defrag",
              )
              assert source_reset.map_changed
              assert source_reset.draw_immediately
              assert source_reset.status is not None
              assert "Authoritative source allocation restored" in source_reset.status
              assert sum(int(cell["used"]) for cell in data["cells"]) == 2

              verified_reset = controller.consume(
                  '@@LIVE_RESET {"scope":"verified-authoritative","unit_size":4096,'
                  '"filesystem_units":8,"used_ranges":[[0,16384]]}',
                  data,
                  purpose="defrag",
              )
              assert verified_reset.map_changed
              assert verified_reset.status is not None
              assert "verified source filesystem" in verified_reset.status
              assert sum(int(cell["used"]) for cell in data["cells"]) == 4

              worker_source = (GUI / "filesystems" / "xfs" / "native" / "xfs_worker.c").read_text()
              plan_source = (GUI / "filesystems" / "xfs" / "native" / "xfs_plan.c").read_text()
              assert 'emit_live_reset(&source, "source-authoritative")' in worker_source
              assert 'emit_live_reset(&committed, "verified-authoritative")' in worker_source
              assert 'emit_live_reset(&verified)' not in worker_source
              assert 'stage-preview' in plan_source
          '''
          if 'test_xfs_live_strokes_are_preview_then_authoritative' not in t:
              if marker not in t:
                  raise SystemExit('GUI regression insertion marker not found')
              t = t.replace(marker, regression + marker, 1)
              main_marker = '    test_map_presenter_handles_domain_and_swap_maps()\n'
              if main_marker not in t:
                  raise SystemExit('GUI regression main marker not found')
              t = t.replace(
                  main_marker,
                  main_marker + '    test_xfs_live_strokes_are_preview_then_authoritative()\n',
                  1,
              )
          tests.write_text(t)
          PY

          rm -f .github/workflows/_temporary-xfs-live-lifecycle.yml
          git config user.name "The-First-Infiltrator"
          git config user.email "infiltratr@yandex.com"
          git add gui/filesystems/xfs/native/xfs_plan.c \
                  gui/filesystems/xfs/native/xfs_worker.c \
                  gui/ui/live_controller.py \
                  tests/test_gui_models.py \
                  .github/workflows/_temporary-xfs-live-lifecycle.yml
          git commit -m "Make XFS live map preview-safe and authoritative"
          git push origin HEAD:c-first-xfs-live-lifecycle
