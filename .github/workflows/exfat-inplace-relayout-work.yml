# SPDX-License-Identifier: GPL-3.0-or-later
name: exFAT in-place relayout work

on:
  push:
    branches:
      - c-first-exfat-relayout-work-125
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-test-publish-branch:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out work branch
        uses: actions/checkout@v4
        with:
          ref: c-first-exfat-relayout-work-125
          fetch-depth: 0
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config python3 python3-gi python3-cairo \
            gir1.2-gtk-3.0 libgtk-3-dev policykit-1 udisks2 util-linux \
            libext2fs-dev libsqlite3-dev libssl-dev

      - name: Generate code-only branch candidate
        shell: bash
        run: |
          set -euo pipefail
          cp tests/apply_exfat_inplace_relayout_patch.py /tmp/apply-exfat-relayout.py
          cp tests/apply_exfat_inplace_relayout_fixups.py /tmp/apply-exfat-relayout-fixups.py
          cp tests/apply_exfat_inplace_relayout_compile_fix.py /tmp/apply-exfat-relayout-compile-fix.py
          git fetch origin main c-first-exfat-relayout-125
          git checkout -B generated origin/main
          python3 /tmp/apply-exfat-relayout.py
          python3 /tmp/apply-exfat-relayout-fixups.py
          python3 /tmp/apply-exfat-relayout-compile-fix.py

      - name: Configure and compile exFAT worker with warnings as errors
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DLD_ENABLE_WERROR=ON \
            -DBUILD_TESTING=ON
          cmake --build build -j2 --target linux-defragger-exfat-worker

      - name: Run exFAT relayout regression
        shell: bash
        run: |
          set -euo pipefail
          bash tests/test_exfat_relayout_engine.sh build/linux-defragger-exfat-worker
          ctest --test-dir build --output-on-failure -R linux-defragger-exfat-relayout

      - name: Run architecture and raw-engine guards
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_no_external_fs_tools.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_architecture.py

      - name: Publish validated code-only branch
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            CMakeLists.txt \
            cmake/project.cmake \
            cmake/exfat_relayout.cmake \
            gui/filesystems/exfat/native/exfat_native.h \
            gui/filesystems/exfat/native/exfat_plan.c \
            gui/filesystems/exfat/native/exfat_relayout.c \
            gui/filesystems/exfat/native/exfat_worker.c \
            gui/filesystems/exfat/plugin.py \
            tests/test_exfat_relayout_engine.sh \
            tests/verify_exfat_relayout.py
          git diff --cached --check
          git commit -m "Replace exFAT shadow image with in-place relayout"
          git push --force origin HEAD:c-first-exfat-relayout-125
