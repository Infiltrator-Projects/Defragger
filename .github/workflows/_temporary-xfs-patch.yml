# SPDX-License-Identifier: GPL-3.0-or-later
name: Temporary XFS patch

on:
  push:
    branches:
      - c-first-xfs-ufs-zfs

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c-first-xfs-ufs-zfs
      - name: Patch XFS checkpoint lifecycle and regression
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('gui/filesystems/xfs/native/xfs_plan.c')
          s = path.read_text()

          marker = '''static int sqlite_fail(sqlite3 *db, char **error, const char *action) {
              xfs_set_error(error, "%s: %s", action, sqlite3_errmsg(db));
              return -1;
          }
          '''
          helper = '''
          static int checkpoint_plan_db(sqlite3 *db, char **error) {
              int log_frames = 0;
              int checkpointed_frames = 0;
              int rc = sqlite3_wal_checkpoint_v2(db, NULL, SQLITE_CHECKPOINT_PASSIVE,
                                                 &log_frames, &checkpointed_frames);
              if (rc == SQLITE_OK) return 0;
              xfs_set_error(error,
                            "cannot checkpoint XFS plan (SQLite %d, %s): %s",
                            rc, sqlite3_errstr(rc), sqlite3_errmsg(db));
              return -1;
          }
          '''
          if 'static int checkpoint_plan_db' not in s:
              if marker not in s:
                  raise SystemExit('sqlite_fail marker not found')
              s = s.replace(marker, marker + helper, 1)

          old_setup = '''    sqlite3_stmt *terminals = NULL;
              const char *terminal_sql =
                  "SELECT b.target FROM blocks b LEFT JOIN blocks s ON s.old=b.target "
                  "WHERE b.old<>b.target AND s.old IS NULL ORDER BY b.target";
              if (sqlite3_prepare_v2(db, terminal_sql, -1, &terminals, NULL) != SQLITE_OK) {
                  close(fd);
                  return sqlite_fail(db, error, "cannot find XFS terminal moves");
              }
              while (sqlite3_step(terminals) == SQLITE_ROW) {
                  uint64_t free_block = (uint64_t)sqlite3_column_int64(terminals, 0);
          '''
          new_setup = '''    sqlite3_stmt *terminals = NULL;
              const char *terminal_sql =
                  "SELECT b.target FROM blocks b LEFT JOIN blocks s ON s.old=b.target "
                  "WHERE b.old<>b.target AND s.old IS NULL AND b.target>? ORDER BY b.target";
              sqlite3_int64 terminal_floor = -1;
              if (sqlite3_prepare_v2(db, terminal_sql, -1, &terminals, NULL) != SQLITE_OK) {
                  close(fd);
                  return sqlite_fail(db, error, "cannot find XFS terminal moves");
              }
              sqlite3_bind_int64(terminals, 1, terminal_floor);
              while (sqlite3_step(terminals) == SQLITE_ROW) {
                  terminal_floor = sqlite3_column_int64(terminals, 0);
                  uint64_t free_block = (uint64_t)terminal_floor;
          '''
          if old_setup not in s:
              raise SystemExit('terminal setup block not found')
          s = s.replace(old_setup, new_setup, 1)

          old_checkpoint = '''            if (placed % 8192U == 0) {
                          if (ld_stop_requested()) { sqlite3_finalize(terminals); close(fd); xfs_set_error(error, "stop requested before XFS source commit"); return -1; }
                          if (sqlite3_exec(db, "PRAGMA wal_checkpoint(PASSIVE)", NULL, NULL, NULL) != SQLITE_OK) {
                              sqlite3_finalize(terminals); close(fd); return sqlite_fail(db, error, "cannot checkpoint XFS plan");
                          }
                          printf("XFS placement: %" PRIu64 " of %" PRIu64 " blocks.\\n", placed, move_count);
                      }
          '''
          new_checkpoint = '''            if (placed % 8192U == 0) {
                          if (ld_stop_requested()) { sqlite3_finalize(terminals); close(fd); xfs_set_error(error, "stop requested before XFS source commit"); return -1; }
                          /* A WAL checkpoint cannot run while the terminal SELECT is active on
                           * this connection.  Finalize it, checkpoint, then resume strictly
                           * after the last terminal target already consumed. */
                          sqlite3_finalize(terminals);
                          terminals = NULL;
                          if (checkpoint_plan_db(db, error) != 0) { close(fd); return -1; }
                          if (sqlite3_prepare_v2(db, terminal_sql, -1, &terminals, NULL) != SQLITE_OK) {
                              close(fd); return sqlite_fail(db, error, "cannot resume XFS terminal moves");
                          }
                          sqlite3_bind_int64(terminals, 1, terminal_floor);
                          printf("XFS placement: %" PRIu64 " of %" PRIu64 " blocks.\\n", placed, move_count);
                      }
          '''
          if old_checkpoint not in s:
              raise SystemExit('terminal checkpoint block not found')
          s = s.replace(old_checkpoint, new_checkpoint, 1)

          old_cycle = '''            if (placed % 8192U == 0 && ld_stop_requested()) {
                          free(saved); close(fd); xfs_set_error(error, "stop requested before XFS source commit"); return -1;
                      }
          '''
          new_cycle = '''            if (placed % 8192U == 0) {
                          if (ld_stop_requested()) {
                              free(saved); close(fd); xfs_set_error(error, "stop requested before XFS source commit"); return -1;
                          }
                          if (checkpoint_plan_db(db, error) != 0) {
                              free(saved); close(fd); return -1;
                          }
                          printf("XFS placement: %" PRIu64 " of %" PRIu64 " blocks.\\n", placed, move_count);
                      }
          '''
          if old_cycle not in s:
              raise SystemExit('cycle checkpoint block not found')
          s = s.replace(old_cycle, new_cycle, 1)
          path.write_text(s)

          test = Path('tests/test_xfs_native.c')
          t = test.read_text()
          insert_at = '\n\nstatic void test_growth_metadata_boundary_slack(void) {'
          regression = r'''

          static void test_payload_checkpoint_boundary(void) {
              enum { MOVE_COUNT = 9000, SOURCE_BASE = 10000 };
              char image_template[] = "/tmp/linux-defragger-xfs-checkpoint-image-XXXXXX";
              int image_fd = mkstemp(image_template);
              CHECK(image_fd >= 0);
              CHECK(ftruncate(image_fd, (off_t)((SOURCE_BASE + MOVE_COUNT) * 512U)) == 0);
              CHECK(close(image_fd) == 0);

              char plan_template[] = "/tmp/linux-defragger-xfs-checkpoint-plan-XXXXXX";
              int plan_fd = mkstemp(plan_template);
              CHECK(plan_fd >= 0);
              CHECK(close(plan_fd) == 0);
              CHECK(unlink(plan_template) == 0);

              char *error = NULL;
              sqlite3 *db = NULL;
              CHECK(xfs_open_plan_db(plan_template, true, &db, &error) == 0);
              CHECK(sqlite3_exec(db, "BEGIN IMMEDIATE", NULL, NULL, NULL) == SQLITE_OK);
              sqlite3_stmt *insert = NULL;
              CHECK(sqlite3_prepare_v2(
                        db,
                        "INSERT INTO blocks(old,target,inode,logical,unwritten) VALUES(?,?,?,?,0)",
                        -1, &insert, NULL) == SQLITE_OK);
              for (sqlite3_int64 index = 0; index < MOVE_COUNT; ++index) {
                  sqlite3_bind_int64(insert, 1, SOURCE_BASE + index);
                  sqlite3_bind_int64(insert, 2, index);
                  sqlite3_bind_int64(insert, 3, 100U);
                  sqlite3_bind_int64(insert, 4, index);
                  CHECK(sqlite3_step(insert) == SQLITE_DONE);
                  CHECK(sqlite3_reset(insert) == SQLITE_OK);
                  CHECK(sqlite3_clear_bindings(insert) == SQLITE_OK);
              }
              CHECK(sqlite3_finalize(insert) == SQLITE_OK);
              CHECK(sqlite3_exec(db, "COMMIT", NULL, NULL, NULL) == SQLITE_OK);

              CHECK(xfs_permute_payloads(image_template, db, 512U, MOVE_COUNT, false, &error) == 0);
              CHECK(error == NULL);
              CHECK(sqlite3_close(db) == SQLITE_OK);
              CHECK(unlink(image_template) == 0);
              CHECK(unlink(plan_template) == 0);
              xfs_clear_error(&error);
          }
          '''
          if 'test_payload_checkpoint_boundary' not in t:
              if insert_at not in t:
                  raise SystemExit('XFS test insertion marker not found')
              t = t.replace(insert_at, regression + insert_at, 1)
              t = t.replace('    test_payload_relocation();\n',
                            '    test_payload_relocation();\n    test_payload_checkpoint_boundary();\n', 1)
              t = t.replace('native XFS CRC, planner, metadata-boundary slack, relocation and feature-gate tests passed',
                            'native XFS CRC, planner, checkpoint, metadata-boundary slack, relocation and feature-gate tests passed', 1)
          test.write_text(t)
          PY

          rm -f .github/workflows/_temporary-xfs-patch.yml
          git config user.name "The-First-Infiltrator"
          git config user.email "infiltratr@yandex.com"
          git add gui/filesystems/xfs/native/xfs_plan.c tests/test_xfs_native.c .github/workflows/_temporary-xfs-patch.yml
          git commit -m "Fix XFS WAL checkpoint lifecycle"
          git push origin HEAD:c-first-xfs-ufs-zfs
