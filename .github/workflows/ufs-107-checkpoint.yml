# SPDX-License-Identifier: GPL-3.0-or-later
name: UFS 107 native checkpoint

on:
  push:
    branches: [c-first-ufs-107]
    paths: [.github/workflows/ufs-107-checkpoint.yml]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config \
            libext2fs-dev libsqlite3-dev libssl-dev
      - name: Prove existing native baseline
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DLD_ENABLE_WERROR=ON -DBUILD_TESTING=ON
          cmake --build build -j2
          ctest --test-dir build --output-on-failure -E '^linux-defragger-tests$'
      - name: Compile and test UFS parser directly
        run: |
          cc -std=c11 -O2 -DNDEBUG -D_FORTIFY_SOURCE=3 \
            -Wall -Wextra -Wpedantic -Wconversion -Wshadow -Wformat=2 -Werror \
            -D_FILE_OFFSET_BITS=64 -D_GNU_SOURCE \
            -Isrc/core -Igui/filesystems/ufs/native \
            gui/filesystems/ufs/native/ufs_native.c tests/test_ufs_native.c \
            src/core/ld_io.c src/core/ld_runtime.c \
            -o build/linux-defragger-ufs-native-test-direct
          ./build/linux-defragger-ufs-native-test-direct
      - name: Compile and smoke-test UFS worker directly
        run: |
          cc -std=c11 -O2 -DNDEBUG -D_FORTIFY_SOURCE=3 \
            -Wall -Wextra -Wpedantic -Wconversion -Wshadow -Wformat=2 -Werror \
            -D_FILE_OFFSET_BITS=64 -D_GNU_SOURCE \
            -Isrc/core -Igui/filesystems/ufs/native -Ibuild/generated \
            gui/filesystems/ufs/native/ufs_native.c gui/filesystems/ufs/native/ufs_worker.c \
            src/core/ld_io.c src/core/ld_runtime.c \
            -o build/linux-defragger-ufs-worker-direct
          test "$(build/linux-defragger-ufs-worker-direct --version)" = \
            "linux-defragger-ufs-worker $(tr -d '\r\n' < VERSION)"
          truncate -s 300000 build/ufs-worker.img
          printf '\x19\x01\x54\x19' | dd of=build/ufs-worker.img bs=1 seek=$((65536+100)) conv=notrunc status=none
          build/linux-defragger-ufs-worker-direct identify build/ufs-worker.img | \
            grep -q '^{"filesystem":"ufs","variant":"ufs2-le","version":2,"byte_order":"little"}$'
          build/linux-defragger-ufs-worker-direct analyse-json build/ufs-worker.img | \
            grep -q '"superblock_offset":65536,"magic_offset":65636'
          output=$(build/linux-defragger-ufs-worker-direct map build/ufs-worker.img --cells 4)
          printf '%s\n' "$output" | grep -q '"filesystem":"ufs","map_accuracy":"summary","unit_size":512'
          printf '%s\n' "$output" | grep -q '"unknown_bytes":300032'
