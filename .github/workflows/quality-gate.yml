# SPDX-License-Identifier: GPL-3.0-or-later
name: Project quality gate

on:
  workflow_call:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: defragger
    steps:
      - name: Check out exact main candidate
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Reject tracked generated state
        shell: bash
        run: |
          set -euo pipefail
          tracked_generated=$(git ls-files | grep -E '(^|/)__pycache__/|\.py[co]$' || true)
          if [ -n "$tracked_generated" ]; then
            printf '%s\n' 'Tracked generated Python state is forbidden:' >&2
            printf '%s\n' "$tracked_generated" >&2
            exit 1
          fi

      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake dpkg-dev pkg-config zip unzip \
            python3 python3-gi python3-cairo \
            gir1.2-gtk-3.0 libgtk-3-dev policykit-1 udisks2 util-linux makefs \
            libext2fs-dev libsqlite3-dev libssl-dev

      - name: Build all first-party C with warnings as errors
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DLD_ENABLE_WERROR=ON \
            -DBUILD_TESTING=ON
          cmake --build build -j2

      - name: Run complete native, filesystem, GUI and release test suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: ${{ github.workspace }}/defragger/gui:${{ github.workspace }}/defragger/tests
          LINUX_DEFRAGGER_BUILD_DIR: ${{ github.workspace }}/defragger/build
        run: ctest --test-dir build --output-on-failure

      - name: Enforce remaining architecture and release invariants
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: ${{ github.workspace }}/defragger/gui:${{ github.workspace }}/defragger/tests
          LINUX_DEFRAGGER_BUILD_DIR: ${{ github.workspace }}/defragger/build
        run: |
          python3 tests/test_btrfs_architecture.py
          python3 tests/test_release_gate.py

  sanitizers:
    name: Hosted ASan / UBSan
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: defragger
    steps:
      - name: Check out exact main candidate
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install sanitizer build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config python3 python3-gi python3-cairo \
            gir1.2-gtk-3.0 libgtk-3-dev policykit-1 udisks2 util-linux makefs \
            libext2fs-dev libsqlite3-dev libssl-dev

      - name: Build with AddressSanitizer and UndefinedBehaviorSanitizer
        run: |
          cmake -S . -B build-sanitize \
            -DCMAKE_BUILD_TYPE=Debug \
            -DLD_ENABLE_WERROR=ON \
            -DLD_ENABLE_SANITIZERS=ON \
            -DBUILD_TESTING=ON
          cmake --build build-sanitize -j2

      - name: Run sanitizer-safe native and filesystem tests
        env:
          ASAN_OPTIONS: halt_on_error=1:detect_leaks=0
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: ${{ github.workspace }}/defragger/gui:${{ github.workspace }}/defragger/tests
          LINUX_DEFRAGGER_BUILD_DIR: ${{ github.workspace }}/defragger/build-sanitize
        run: |
          ctest --test-dir build-sanitize --output-on-failure \
            -E '^linux-defragger-tests$'

  local-quality:
    name: Local Linux / heavy qualification
    runs-on: linux-native
    timeout-minutes: 45
    defaults:
      run:
        working-directory: defragger
    steps:
      - name: Check out exact main candidate
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build all first-party C with warnings as errors
        run: |
          cmake -S . -B build-local \
            -DCMAKE_BUILD_TYPE=Release \
            -DLD_ENABLE_WERROR=ON \
            -DBUILD_TESTING=ON
          cmake --build build-local -j2
      - name: Run local native, filesystem and GUI tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: ${{ github.workspace }}/defragger/gui:${{ github.workspace }}/defragger/tests
          LINUX_DEFRAGGER_BUILD_DIR: ${{ github.workspace }}/defragger/build-local
        run: |
          ctest --test-dir build-local --output-on-failure -I 1,10
          ctest --test-dir build-local --output-on-failure -I 12,30
      - name: Enforce architecture and release contracts
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: ${{ github.workspace }}/defragger/gui:${{ github.workspace }}/defragger/tests
          LINUX_DEFRAGGER_BUILD_DIR: ${{ github.workspace }}/defragger/build-local
        run: |
          python3 tests/test_architecture.py
          python3 tests/test_btrfs_architecture.py
          python3 tests/test_release_gate.py
