name: Project quality gate

on:
  pull_request:

permissions:
  contents: write

jobs:
  cleanup-stale-branches:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Delete every non-main branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branches=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/branches?per_page=100" --jq '.[].name')
          printf '%s\n' "$branches" | while IFS= read -r branch; do
            if [ "$branch" != "main" ]; then
              echo "Deleting stale branch: $branch"
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
            fi
          done
