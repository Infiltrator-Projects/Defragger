# SPDX-License-Identifier: GPL-3.0-or-later
name: Project quality gate

on:
  workflow_call:
  pull_request:
  push:
    branches:
      - main
      - "c-first-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake dpkg-dev pkg-config zip unzip \
            python3 python3-gi python3-cairo \
            gir1.2-gtk-3.0 libgtk-3-dev policykit-1 udisks2 util-linux makefs \
            libext2fs-dev libsqlite3-dev libssl-dev

      - name: Build all first-party C with warnings as errors
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DLD_ENABLE_WERROR=ON \
            -DBUILD_TESTING=ON
          cmake --build build -j2

      - name: Run native and filesystem safety tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: ${{ github.workspace }}/gui:${{ github.workspace }}/tests
          LINUX_DEFRAGGER_BUILD_DIR: ${{ github.workspace }}/build
        run: ctest --test-dir build --output-on-failure -E '^linux-defragger-tests$'

      - name: Enforce architecture and licensing invariants
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: ${{ github.workspace }}/gui:${{ github.workspace }}/tests
          LINUX_DEFRAGGER_BUILD_DIR: ${{ github.workspace }}/build
        run: |
          python3 -m compileall -q gui
          python3 tests/test_spdx_licensing.py
          python3 tests/test_no_external_fs_tools.py
          python3 tests/test_architecture.py
          python3 tests/test_analysis_plugins.py
          python3 tests/test_worker_entrypoints.py

      - name: Validate release packaging contract
        run: ./tests/test_release_artifacts.sh
