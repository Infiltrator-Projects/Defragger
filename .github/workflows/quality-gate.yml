name: Project quality gate

on:
  pull_request:

permissions:
  contents: write

jobs:
  cleanup-stale-branches:
    runs-on: windows-latest
    steps:
      - name: Delete every non-main branch
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $branches = gh api --paginate "repos/$env:GITHUB_REPOSITORY/branches?per_page=100" --jq '.[].name'
          if ($LASTEXITCODE -ne 0) { throw 'Unable to list branches.' }
          foreach ($branch in $branches) {
            if ($branch -ne 'main') {
              Write-Host "Deleting stale branch: $branch"
              gh api --method DELETE "repos/$env:GITHUB_REPOSITORY/git/refs/heads/$branch"
              if ($LASTEXITCODE -ne 0) { throw "Unable to delete branch: $branch" }
            }
          }
